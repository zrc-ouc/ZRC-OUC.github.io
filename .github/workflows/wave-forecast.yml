name: ECMWF 15-day wave forecast

on:
  workflow_dispatch:
  schedule:
    # 20:17 China Standard Time. Change this schedule as desired.
    - cron: '17 20 * * *'
      timezone: Asia/Shanghai

permissions:
  contents: read

concurrency:
  group: ecmwf-wave-forecast
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Download and render forecast
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python wave_forecast.py --output-dir output
      - name: Upload GIF
        uses: actions/upload-artifact@v5
        with:
          name: ecmwf-wave-forecast-${{ github.run_id }}
          path: output/*.gif
          if-no-files-found: error
          retention-days: 30
