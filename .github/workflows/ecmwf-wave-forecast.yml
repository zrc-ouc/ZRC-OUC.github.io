name: ECMWF 15-day wave forecast

on:
  workflow_dispatch:
  schedule:
    # At minute 17 of every hour; forecast frames remain at 00 UTC.
    - cron: '17 * * * *'
      timezone: Asia/Shanghai

permissions:
  contents: write

concurrency:
  # Share the buoy workflow's commit queue because both push to master.
  group: ocean-plot
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: wave-forecast/requirements.txt
      - name: Install wave forecast dependencies
        run: python -m pip install -r wave-forecast/requirements.txt
      - name: Download and render wave forecast
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python wave-forecast/wave_forecast.py --output-dir wave-forecast/output
      - name: Commit latest forecast GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- wave-forecast/output
          if git diff --cached --quiet; then
            echo "Forecast GIF is unchanged; no commit needed."
            exit 0
          fi
          git commit -m "chore: update latest wave forecast GIF"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing onto latest ${GITHUB_REF_NAME}."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          exit 1
