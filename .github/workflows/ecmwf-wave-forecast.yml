name: ECMWF 15-day wave forecast

on:
  workflow_dispatch:
  schedule:
    # At minute 17 of every hour; forecast frames remain at 00 UTC.
    - cron: '17 * * * *'
      timezone: Asia/Shanghai

permissions:
  contents: read

concurrency:
  group: ecmwf-wave-forecast
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: wave-forecast/requirements.txt
      - name: Install wave forecast dependencies
        run: python -m pip install -r wave-forecast/requirements.txt
      - name: Download and render wave forecast
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python wave-forecast/wave_forecast.py --output-dir wave-forecast/output
      - name: Upload forecast GIF
        uses: actions/upload-artifact@v5
        with:
          name: ecmwf-wave-forecast-${{ github.run_id }}
          path: wave-forecast/output/*.gif
          if-no-files-found: error
          retention-days: 30
