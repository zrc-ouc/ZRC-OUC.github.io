name: Update Ocean Plot

on:
  schedule:
    # 每小时第 7、17、27、37、47、57 分钟运行（UTC）；避开整点高峰
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式：plot=正常出图; inspect=打印表结构; sample=打印最新一行原始数据(排查列名); list=列出表名"
        required: false
        default: "plot"
        type: choice
        options:
          - plot
          - inspect
          - sample
          - list

jobs:
  plot:
    runs-on: ubuntu-latest
    # 所有 run 步骤默认在 ocean-plot/ 子目录执行，不干扰仓库根的网站文件
    defaults:
      run:
        working-directory: ocean-plot
    # 防止同一轮任务同时写图
    concurrency:
      group: ocean-plot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MATLAB-compatible serif font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data & plot
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          else
            MODE="plot"
          fi
          echo "运行模式: $MODE"
          case "$MODE" in
            inspect)
              python fetch_and_plot_ckeo.py --inspect
              python fetch_and_plot_ckeo_a.py --inspect
              ;;
            sample)
              python fetch_and_plot_ckeo.py --sample
              python fetch_and_plot_ckeo_a.py --sample
              ;;
            list)
              python fetch_and_plot_ckeo.py --list-tables
              python fetch_and_plot_ckeo_a.py --list-tables
              ;;
            *)
              # 同一 job 内按顺序执行：先 CKEO，再 CKEO-A
              python fetch_and_plot_ckeo.py
              python fetch_and_plot_ckeo_a.py
              ;;
          esac

      - name: Commit updated plots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update ocean weather plots"
          file_pattern: "ocean-plot/figures/*.png"
