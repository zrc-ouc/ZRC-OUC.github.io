            <!-- 伙伴系统界面 -->

        <!-- Bottom navigation bar -->

    <script src="js/unitTypes.js"></script>
    <script src="js/gameState.js"></script>

    <script src="js/findTarget.js"></script>
    <script src="js/synergies.js"></script>

    <script>        
        // Generate random units for selection
        function generateRandomUnits() {
            availableUnitsContainer.innerHTML = '';
            gameState.units.available = [];
            
            // 只选择inPool值为1的单位类型
            // 并且只选择已解锁的伙伴
            const types = Object.keys(unitTypes).filter(type => {
                // 检查是否在可用池中
                const inPool = unitTypes[type].inPool === 1;
                // 检查是否已解锁
                const isUnlocked = gameState.unlockedPartners[type] === true;
                
                return inPool && isUnlocked;
            });
            
            // 如果没有可用单位（全部未解锁），显示提示
            if (types.length === 0) {
                const noUnitsMessage = document.createElement('div');
                noUnitsMessage.className = 'no-units-message';
                noUnitsMessage.textContent = '没有可用的伙伴！请先在酒馆解锁伙伴。';
                noUnitsMessage.style.color = '#fff';
                noUnitsMessage.style.padding = '20px';
                noUnitsMessage.style.textAlign = 'center';
                availableUnitsContainer.appendChild(noUnitsMessage);
                return;
            }
            
            // Generate 6 random units
            for (let i = 0; i < 6; i++) {
                const type = types[Math.floor(Math.random() * types.length)];
                const unit = createUnit(type, 1);
                gameState.units.available.push(unit);
                
                const unitElement = createUnitElement(unit, i);
                availableUnitsContainer.appendChild(unitElement);
            }
            
            // Reset reserve area
            gameState.units.reserve = [null, null, null, null, null, null];
            updateReserveArea();
        }
        
        // Create a unit object
        function createUnit(type, level) {
            const baseStats = unitTypes[type];
            const levelMultiplier = level === 1 ? 1 : level === 2 ? 2 : 4;
            
            const unit = {
                element: baseStats.element,
                type: type,
                level: level,
                maxHP: baseStats.hp * levelMultiplier,
                currentHP: baseStats.hp * levelMultiplier,
                attack: baseStats.attack * levelMultiplier,
                speed: baseStats.speed,
                manaRegen: baseStats.manaRegen,
                mana: 0, // 初始蓝量为0
                job: baseStats.job, // 职业
                statusEffects: {},
                passiveSkills: {}
            };
            
            // 初始化被动技能
            if (type === 'fire' && baseStats.passiveSkills) {
                // 初始化反击技能
                if (level >= baseStats.passiveSkills.counterAttack.unlockLevel) {
                    unit.passiveSkills.counterAttack = {
                        isCountering: false
                    };
                }
                
                // 初始化血怒技能
                if (level >= baseStats.passiveSkills.bloodRage.unlockLevel) {
                    unit.passiveSkills.bloodRage = {};
                }
            }
            
            // 初始化暗夜女王蝙蝠数量
            if (type === 'darkQueen' && baseStats.batCount) {
                unit.batCount = baseStats.batCount;
                unit.attachedBats = {};
            }
            
            return unit;
        }
        
        // Create a visual element for a unit
        function createUnitElement(unit, index) {
            const unitElement = document.createElement('div');
            unitElement.className = `unit unit-${unit.type}`;
            unitElement.dataset.index = index;
            
            // 清除可能存在的旧元素
            const oldHp = unitElement.querySelector('.unit-hp');
            const oldAttack = unitElement.querySelector('.unit-attack');
            const oldLevel = unitElement.querySelector('.unit-level');
            if (oldHp) unitElement.removeChild(oldHp);
            if (oldAttack) unitElement.removeChild(oldAttack);
            if (oldLevel) unitElement.removeChild(oldLevel);
            
            const hpElement = document.createElement('div');
            hpElement.className = 'unit-hp';
            hpElement.innerHTML = `❤️${unit.currentHP}`;
            unitElement.appendChild(hpElement);
            
            const attackElement = document.createElement('div');
            attackElement.className = 'unit-attack';
            attackElement.innerHTML = `${unitTypes[unit.type].icon}${unit.attack}`;
            unitElement.appendChild(attackElement);
            
            const levelElement = document.createElement('div');
            levelElement.className = 'unit-level';
            levelElement.textContent = `Lv${unit.level}`;
            unitElement.appendChild(levelElement);
            
            // Make unit draggable
            unitElement.draggable = true;
            unitElement.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', index);
            });
            
            // Add click handler to move unit to first empty reserve slot
            unitElement.addEventListener('click', () => {
                const emptySlotIndex = gameState.units.reserve.findIndex(slot => slot === null);
                if (emptySlotIndex !== -1) {
                    gameState.units.reserve[emptySlotIndex] = gameState.units.available[index];
                    gameState.units.available[index] = null;
                    updateReserveArea();
                    unitElement.style.visibility = 'hidden';
                    
                    // 更新队伍数量显示
                    if (typeof updateTeamCount === 'function') {
                        updateTeamCount();
                    }
                }
            });
            
            return unitElement;
        }
        
        // Update the reserve area display
        function updateReserveArea() {
            const slots = reserveArea.querySelectorAll('.reserve-slot');
            
            slots.forEach((slot, index) => {
                // Clear the slot
                slot.innerHTML = '';
                
                // If there's a unit in this slot, display it
                if (gameState.units.reserve[index] !== null) {
                    const unit = gameState.units.reserve[index];
                    slot.style.backgroundColor = unitTypes[unit.type].color;
                    
                    // 清除可能存在的旧元素
                    const oldHp = slot.querySelector('.unit-hp');
                    const oldAttack = slot.querySelector('.unit-attack');
                    const oldLevel = slot.querySelector('.unit-level');
                    if (oldHp) slot.removeChild(oldHp);
                    if (oldAttack) slot.removeChild(oldAttack);
                    if (oldLevel) slot.removeChild(oldLevel);
                    
                    const hpElement = document.createElement('div');
                    hpElement.className = 'unit-hp';
                    hpElement.innerHTML = `❤️${Math.round(unit.currentHP)}`;
                    slot.appendChild(hpElement);
                    
                    const attackElement = document.createElement('div');
                    attackElement.className = 'unit-attack';
                    attackElement.innerHTML = `${unitTypes[unit.type].icon}${unit.attack}`;
                    slot.appendChild(attackElement);
                    
                    const levelElement = document.createElement('div');
                    levelElement.className = 'unit-level';
                    levelElement.textContent = `Lv${unit.level}`;
                    slot.appendChild(levelElement);
                    
                    // Add click handler to remove unit from reserve
                    slot.addEventListener('click', () => {
                        // Find the original unit in available units
                        const availableIndex = gameState.units.available.findIndex(u => u === null);
                        if (availableIndex !== -1) {
                            gameState.units.available[availableIndex] = gameState.units.reserve[index];
                            
                            // Update available unit display
                            const availableUnits = availableUnitsContainer.querySelectorAll('.unit');
                            if (availableUnits[availableIndex]) {
                                availableUnits[availableIndex].style.visibility = 'visible';
                            }
                        }
                        
                        // Remove from reserve
                        gameState.units.reserve[index] = null;
                        updateReserveArea();
                        
                        // 更新队伍数量显示
                        updateTeamCount();
                    });
                } else {
                    slot.style.backgroundColor = '#666';
                }
            });
            
            // 检查是否有单位在备战区，显示或隐藏进入地牢按钮
            const hasUnits = gameState.units.reserve.some(unit => unit !== null);
            enterDungeonButton.style.display = hasUnits ? 'block' : 'none';
            
            // 更新队伍数量显示
            updateTeamCount();
        }
        
        // Set up drag and drop for units
        availableUnitsContainer.addEventListener('dragover', (e) => {
            e.preventDefault();
        });
        
        reserveArea.addEventListener('dragover', (e) => {
            e.preventDefault();
        });
        
        reserveArea.addEventListener('drop', (e) => {
            e.preventDefault();
            let unitData, sourceType, sourceIndex;
            
            try {
                // 尝试解析为JSON数据
                unitData = JSON.parse(e.dataTransfer.getData('application/json'));
                sourceType = unitData.sourceType;
                sourceIndex = unitData.sourceIndex;
            } catch (error) {
                // 如果JSON解析失败，尝试使用text/plain格式
                const textData = e.dataTransfer.getData('text/plain');
                if (textData) {
                    // 如果是纯文本数据，假定是从初始单位列表拖过来的
                    sourceType = 'available';
                    sourceIndex = parseInt(textData);
                } else {
                    // 如果没有任何有效数据，则退出
                    console.error('无法解析拖拽数据');
                    return;
                }
            }
            
            const targetIndex = parseInt(cell.dataset.index);
            
            // Find the first empty slot
            const emptySlotIndex = gameState.units.reserve.findIndex(slot => slot === null);
            
            if (emptySlotIndex !== -1) {
                gameState.units.reserve[emptySlotIndex] = unit;
                gameState.units.available[unitIndex] = null;
                
                // Remove the unit from the available units display
                const unitElement = availableUnitsContainer.querySelector(`[data-index="${unitIndex}"]`);
                if (unitElement) {
                    unitElement.style.visibility = 'hidden';
                }
                
                updateReserveArea();
            }
        });
        
        // DOM elements for battle screen
        const battleScreen = document.getElementById('battle-screen');
        const battleGrid = document.getElementById('battle-grid');
        const battleButton = document.getElementById('battle-button');
        const battleReserveArea = document.getElementById('battle-reserve-area');
        const cageContainer = document.getElementById('cage-container');
        
        // 单位回复功能
        function healUnits() {
            let continueHealing = true;
            
            while (continueHealing) {
                if (gameState.player.oxygen < 1) {
                    alert('氧气不足，无法回复单位！');
                    break;
                }
                
                const injuredUnits = [];
                for (let i = 24; i < 48; i++) {
                    const unit = gameState.units.battleField[i];
                    if (unit && unit.currentHP < unit.maxHP) {
                        injuredUnits.push({
                            unit: unit,
                            index: i
                        });
                    }
                }
                
                const injuredCount = injuredUnits.length;
                if (injuredCount === 0) {
                    alert('所有单位已满血！');
                    break;
                }
                
                const oxygenAvailable = gameState.player.oxygen;
                let oxygenUsed = 0;
                
                if (oxygenAvailable < injuredCount) {
                    for (let i = 0; i < oxygenAvailable; i++) {
                        injuredUnits[i].unit.currentHP += 1;
                        oxygenUsed += 1;
                    }
                } else {
                    for (let i = 0; i < injuredCount; i++) {
                        injuredUnits[i].unit.currentHP += 1;
                    }
                    oxygenUsed = injuredCount;
                }
                
                // 扣除氧气值
                gameState.player.oxygen -= oxygenUsed;
                oxygenDisplay.textContent = `氧气: ${gameState.player.oxygen}`;
                
                // 更新单位显示
                updateBattlefieldDisplay();
            }
        }
        
        // Initialize battle grid
        function initBattleGrid() {
            battleGrid.innerHTML = '';
            
            // Create 8x6 grid
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 6; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.dataset.index = row * 6 + col;
                    
                    // Mark enemy and player areas
                    if (row < 4) {
                        cell.classList.add('enemy-area');
                    } else {
                        cell.classList.add('player-area');
                    }
                    
                    // Set up drag and drop for all cells
                    cell.addEventListener('dragover', (e) => {
                        e.preventDefault();
                    });
                    
                    cell.addEventListener('drop', (e) => {
                        e.preventDefault();
                        let unitData, sourceType, sourceIndex;
                        
                        try {
                            // 尝试解析为JSON数据
                            unitData = JSON.parse(e.dataTransfer.getData('application/json'));
                            sourceType = unitData.sourceType;
                            sourceIndex = unitData.sourceIndex;
                        } catch (error) {
                            // 如果JSON解析失败，尝试使用text/plain格式
                            const textData = e.dataTransfer.getData('text/plain');
                            if (textData) {
                                // 如果是纯文本数据，假定是从初始单位列表拖过来的
                                sourceType = 'available';
                                sourceIndex = parseInt(textData);
                            } else {
                                // 如果没有任何有效数据，则退出
                                console.error('无法解析拖拽数据');
                                return;
                            }
                        }
                        
                        const targetIndex = parseInt(cell.dataset.index);
                        
                        // 检查是否拖回原位置
                        if (sourceType === 'battlefield' && sourceIndex === targetIndex) {
                            // 拖回原位置，不做任何操作
                            return;
                        }
                        
                        // 获取源单位
                        let sourceUnit;
                        if (sourceType === 'cage') {
                            sourceUnit = gameState.units.cage;
                        } else if (sourceType === 'battlefield') {
                            sourceUnit = gameState.units.battleField[sourceIndex];
                        } else if (sourceType === 'reserve') {
                            sourceUnit = gameState.units.reserve[sourceIndex];
                        } else if (sourceType === 'available') {
                            sourceUnit = gameState.units.available[sourceIndex];
                        }
                        
                        if (!sourceUnit) return; // 如果源单位不存在，直接返回
                        
                        // 检查是否为敌方区域 (索引小于24)
                        if (targetIndex < 24) {
                            // 敌方区域只允许放置火药桶
                            if (sourceUnit.type === 'barrel' && sourceUnit.isTrap) {
                                // 检查目标位置是否为空
                                if (!gameState.units.battleField[targetIndex]) {
                                    // 移动火药桶到敌方区域
                                    moveUnitToBattlefield(sourceType, sourceIndex, targetIndex);
                                } else {
                                    alert('目标位置已有单位！');
                                }
                            } else {
                                // 不允许放置非火药桶单位到敌方区域
                                alert('只有火药桶可以放置到敌方区域！');
                            }
                            return;
                        }
                        
                        // 处理玩家区域
                        const targetUnit = gameState.units.battleField[targetIndex];
                        
                        // 检查是否可以融合成高级单位
                        if (targetUnit && sourceUnit && targetUnit.level === 3 && sourceUnit.level === 3) {
                            // 检查是否满足融合条件
                            let canFuse = false;
                            let fusionType = null;
                            
                            // 遍历所有单位类型，查找可融合的单位
                            for (const type in unitTypes) {
                                const unitType = unitTypes[type];
                                if (unitType.isFusionUnit && unitType.fusionRequirements) {
                                    const req = unitType.fusionRequirements;
                                    // 检查是否满足融合要求
                                    if (req.level === 3) {
                                        // 检查两个单位的元素属性是否匹配融合要求
                                        const requiredTypes = req.units;
                                        
                                        // 特殊处理生命之母的融合条件：需要莲花仙女和冰霜术士
                                        if (type === 'motherOfLife' && 
                                            ((targetUnit.type === 'lotusNymph' && sourceUnit.type === 'frostMage') || 
                                             (targetUnit.type === 'frostMage' && sourceUnit.type === 'lotusNymph'))) {
                                            canFuse = true;
                                            fusionType = type;
                                            break;
                                        }

                                        // 特殊处理圣战士的融合条件：需要红缨枪和熔岩战士
                                        if (type === 'holyWarrior' && 
                                            ((targetUnit.type === 'fireSpear' && sourceUnit.type === 'lavaGuardian') || 
                                             (targetUnit.type === 'lavaGuardian' && sourceUnit.type === 'fireSpear'))) {
                                            canFuse = true;
                                            fusionType = type;
                                            break;
                                        }

                                        // 特殊处理暗夜女王的融合条件：需要圣战士和雷霆射手
                                        if (type === 'darkQueen' && 
                                            ((targetUnit.type === 'holyWarrior' && sourceUnit.type === 'thunderArcher') || 
                                             (targetUnit.type === 'thunderArcher' && sourceUnit.type === 'holyWarrior'))) {
                                            canFuse = true;
                                            fusionType = type;
                                            break;
                                        }

                                        // 常规元素融合条件
                                        else if (requiredTypes && requiredTypes.includes(targetUnit.element) && 
                                                requiredTypes.includes(sourceUnit.element) && 
                                                targetUnit.element !== sourceUnit.element) {
                                            canFuse = true;
                                            fusionType = type;
                                            break;
                                        }
                                    }
                                }
                            }
                            
                            if (canFuse && fusionType) {
                                // 创建融合单位
                                const fusionUnit = createUnit(fusionType, 3);

        // 尝试逃跑
        function attemptEscape() {
            const cageType = gameState.battle.cageType;
            const escapeChance = cageType === 'normal' ? 0.99 : 0.3; // 普通牢笼50%，精英牢笼30%
            
            if (Math.random() < escapeChance) {
                // 逃跑成功
                alert('逃跑成功！');
                
                // 保存存钱罐的击杀计数
                for (let i = 0; i < gameState.units.battleField.length; i++) {
                    const unit = gameState.units.battleField[i];
                    if (unit && unit.type === 'piggyBank') {
                        // 保存击杀计数到gameState
                        gameState.traps.piggyBank.savedKillCount = unit.killCount || 0;
                        console.log(`保存存钱罐计数：${gameState.traps.piggyBank.savedKillCount}`);
                        break;
                    }
                }
                
                // 记录各个机关的位置信息
                for (let i = 0; i < gameState.units.battleField.length; i++) {
                    const unit = gameState.units.battleField[i];
                    if (unit && unit.isTrap) {
                        // 根据机关类型记录位置
                        switch (unit.type) {
                            case 'scarecrow':
                                gameState.traps.scarecrow.lastPosition = i;
                                console.log(`记录稻草人位置：${i}`);
                                break;
                            case 'barrel':
                                gameState.traps.barrel.lastPosition = i;
                                console.log(`记录火药桶位置：${i}`);
                                break;
                            case 'crossbow':
                                gameState.traps.crossbow.lastPosition = i;
                                console.log(`记录连弩位置：${i}`);
                                break;
                            case 'piggyBank':
                                gameState.traps.piggyBank.lastPosition = i;
                                console.log(`记录存钱罐位置：${i}`);
                                break;
                            case 'holyFlag':
                                gameState.traps.holyFlag.lastPosition = i;
                                console.log(`记录圣旗位置：${i}`);
                                break;
                        }
                    }
                }
                
                // 清空场上所有机关单位
                for (let i = 0; i < gameState.units.battleField.length; i++) {
                    const unit = gameState.units.battleField[i];
                    if (unit && unit.isTrap) {
                        // 清除机关单位
                        gameState.units.battleField[i] = null;
                        
                        // 清除对应的视觉显示
                        const trapCell = document.querySelector(`.grid-cell[data-index="${i}"]`);
                        if (trapCell) {
                            trapCell.innerHTML = '';
                            trapCell.style.backgroundColor = i < 24 ? 'rgba(255, 82, 82, 0.1)' : 'rgba(79, 195, 247, 0.1)';
                        }
                    }
                }
                
                // 清理傀儡
                if (unitTypes.earthPup && unitTypes.earthPup.skill) {
                    unitTypes.earthPup.skill.cleanupAllPuppets();
                }
                
                // 备份单位信息
                backupUnitInfo();
                // 返回地图
                showScreen('dungeon-map');
            } else {
                // 逃跑失败
                alert('逃跑失败！必须完成战斗才能离开。');
                // 禁用逃跑按钮
                const escapeButton = document.getElementById('escape-button');
                escapeButton.disabled = true;
                escapeButton.style.backgroundColor = '#888';
            }
        }
        
        // 开始战斗
        function startBattle(cageType, cageAttribute) {
            gameState.battle.isActive = true;
            gameState.battle.cageType = cageType;
            gameState.battle.cageAttribute = cageAttribute || 'fire'; // 默认为火属性
            gameState.battle.dungeonLevel = gameState.dungeon.level;
            
            // 重置战场
            gameState.units.battleField = Array(48).fill(null);
            
            // 恢复单位信息
            if (playerUnitBackup && playerUnitBackup.length > 0) {
                restoreUnitInfo();
            }
            
            // Initialize battle UI
            initBattleGrid();
            initBattleReserveArea();
            generateCageUnit();
            generateEnemies();
            
            // 放置解锁的机关到战场（在生成敌方单位后执行）
            placeTrapUnits();
            
            updateBattlefieldDisplay();

            battleButton.disabled = false;
            battleButton.onclick = startBattleAction;
            
            // 初始化单位回复按钮

            healButton.onclick = healUnits;

            showScreen('battle');

        // 放置机关单位到战场
        function placeTrapUnits() {
            // 获取已解锁的机关
            const unlockedTraps = [];
            
            // 稻草人 - 放置在我方区域
            if (gameState.traps.scarecrow.unlocked) {
                const scarecrow = createTrapUnit('scarecrow', gameState.traps.scarecrow.level);
                unlockedTraps.push({
                    unit: scarecrow,
                    isPlayerSide: true,
                    type: 'scarecrow',
                    lastPosition: gameState.traps.scarecrow.lastPosition
                });
            }
            
            // 火药桶 - 放置在敌方区域
            if (gameState.traps.barrel.unlocked) {
                const barrel = createTrapUnit('barrel', gameState.traps.barrel.level);
                unlockedTraps.push({
                    unit: barrel,
                    isPlayerSide: false,
                    type: 'barrel',
                    lastPosition: gameState.traps.barrel.lastPosition
                });
            }
            
            // 连弩 - 放置在我方区域
            if (gameState.traps.crossbow.unlocked) {
                const crossbow = createTrapUnit('crossbow', gameState.traps.crossbow.level);
                unlockedTraps.push({
                    unit: crossbow,
                    isPlayerSide: true,
                    type: 'crossbow',
                    lastPosition: gameState.traps.crossbow.lastPosition
                });
            }
            
            // 存钱罐 - 放置在我方区域
            if (gameState.traps.piggyBank.unlocked) {
                const piggyBank = createTrapUnit('piggyBank', gameState.traps.piggyBank.level);
                // 设置存钱罐的击杀计数
                piggyBank.killCount = gameState.traps.piggyBank.savedKillCount || 0;
                unlockedTraps.push({
                    unit: piggyBank,
                    isPlayerSide: true,
                    type: 'piggyBank',
                    lastPosition: gameState.traps.piggyBank.lastPosition
                });
            }
            
            // 圣旗 - 放置在我方区域
            if (gameState.traps.holyFlag.unlocked) {
                const holyFlag = createTrapUnit('holyFlag', gameState.traps.holyFlag.level);
                unlockedTraps.push({
                    unit: holyFlag,
                    isPlayerSide: true,
                    type: 'holyFlag',
                    lastPosition: gameState.traps.holyFlag.lastPosition
                });
            }
            
            // 放置机关到战场
            for (let i = 0; i < unlockedTraps.length; i++) {
                const trap = unlockedTraps[i];
                
                // 确定放置区域
                const startIndex = trap.isPlayerSide ? 24 : 0;
                const endIndex = trap.isPlayerSide ? 48 : 24;
                
                // 找出所有空闲位置
                const emptyPositions = [];
                for (let j = startIndex; j < endIndex; j++) {
                    if (gameState.units.battleField[j] === null) {
                        emptyPositions.push(j);
                    }
                }
                
                // 如果有空闲位置
                if (emptyPositions.length > 0) {
                    let position;
                    
                    // 检查上次记录的位置是否可用
                    if (trap.lastPosition >= startIndex && trap.lastPosition < endIndex && 
                        gameState.units.battleField[trap.lastPosition] === null) {
                        // 如果上次位置在有效范围内且为空，则使用上次位置
                        position = trap.lastPosition;
                        console.log(`${trap.unit.type}机关放置在记忆位置${position}`);
                    } else {
                        // 否则随机选择一个空闲位置
                        const randomIndex = Math.floor(Math.random() * emptyPositions.length);
                        position = emptyPositions[randomIndex];
                        console.log(`${trap.unit.type}机关放置在随机位置${position}`);
                    }
                    
                    // 放置机关
                    gameState.units.battleField[position] = trap.unit;
                    
                    // 如果是存钱罐，更新显示
                    if (trap.unit.type === 'piggyBank') {
                        setTimeout(() => {
                            updatePiggyBankDisplay(trap.unit);
                        }, 100);
                    }
                }
            }
        }
        
        // 创建机关单位
        function createTrapUnit(type, level) {
            const baseStats = unitTypes[type];
            let unit = {
                type: type,
                level: level,
                element: baseStats.element,
                job: baseStats.job,
                isTrap: true,
                mana: 0,
                statusEffects: {},
                passiveSkills: {}
            };
            
            // 从unitTypes读取基础属性并根据等级调整
            unit.maxHP = baseStats.hp + (level - 1);
            unit.currentHP = unit.maxHP;
            
            // 根据机关类型调整攻击力
            if (type === 'barrel' || type === 'crossbow') {
                unit.attack = baseStats.attack * (1 + (level - 1) * 0.1);
            } else {
                unit.attack = baseStats.attack;
            }
            
            unit.speed = baseStats.speed;
            unit.manaRegen = baseStats.manaRegen;
            
            // 为存钱罐添加killCount属性
            if (type === 'piggyBank') {
                unit.killCount = 0;
            }
            
            // 为稻草人添加复活倒计时属性
            if (type === 'scarecrow') {
                unit.resurrectionCountdown = 0; // 0表示未激活复活倒计时
            }
            
            // 正确地复制被动技能
            if (baseStats.passiveSkills) {
                for (const skillKey in baseStats.passiveSkills) {
                    unit.passiveSkills[skillKey] = {};
                    
                    // 复制技能的名称和描述
                    unit.passiveSkills[skillKey].name = baseStats.passiveSkills[skillKey].name;
                    unit.passiveSkills[skillKey].description = baseStats.passiveSkills[skillKey].description;
                    
                    // 复制特定技能的特殊属性和方法
                    if (skillKey === 'autoAttack' && baseStats.passiveSkills[skillKey].lastAttackTime) {
                        unit.passiveSkills[skillKey].lastAttackTime = baseStats.passiveSkills[skillKey].lastAttackTime;
                    }
                    
                    // 复制技能效果函数
                    if (baseStats.passiveSkills[skillKey].effect) {
                        unit.passiveSkills[skillKey].effect = baseStats.passiveSkills[skillKey].effect;
                    }
                    
                    // 复制特定技能的其他方法
                    if (skillKey === 'healing' && baseStats.passiveSkills[skillKey].isInRange) {
                        unit.passiveSkills[skillKey].isInRange = baseStats.passiveSkills[skillKey].isInRange;
                    }
                    
                    // 复制存钱罐的onDeath方法
                    if (skillKey === 'countKills' && baseStats.passiveSkills[skillKey].onDeath) {
                        unit.passiveSkills[skillKey].onDeath = baseStats.passiveSkills[skillKey].onDeath;
                    }
                }
            }
            
            return unit;
        }
        
        // Initialize battle reserve area
        function initBattleReserveArea() {
            battleReserveArea.innerHTML = '';
            
            // Create slots for reserve units
            for (let i = 0; i < 6; i++) {
                const slot = document.createElement('div');
                slot.className = 'reserve-slot';
                slot.dataset.index = i;
                
                // Add drop event handlers for battlefield units
                slot.addEventListener('dragover', (e) => {
                    e.preventDefault();
                });
                
                slot.addEventListener('drop', (e) => {
                    e.preventDefault();
                    let unitData, sourceType, sourceIndex;
                    
                    try {
                        // 尝试解析为JSON数据
                        unitData = JSON.parse(e.dataTransfer.getData('application/json'));
                        sourceType = unitData.sourceType;
                        sourceIndex = unitData.sourceIndex;
                    } catch (error) {
                        // 如果JSON解析失败，尝试使用text/plain格式
                        const textData = e.dataTransfer.getData('text/plain');
                        if (textData) {
                            // 如果是纯文本数据，假定是从初始单位列表拖过来的
                            sourceType = 'available';
                            sourceIndex = parseInt(textData);
                        } else {
                            // 如果没有任何有效数据，则退出
                            console.error('无法解析拖拽数据');
                            return;
                        }
                    }
                    
                    const targetIndex = i; // 使用当前循环的索引作为目标索引
                    
                    // 是否拖回原位置
                    if (sourceType === 'reserve' && sourceIndex === targetIndex) {
                        return;
                    }
                    
                    let sourceUnit;
                    if (sourceType === 'cage') {
                        sourceUnit = gameState.units.cage;
                    } else {
                        sourceUnit = sourceType === 'battlefield' ? 
                            gameState.units.battleField[sourceIndex] : 
                            gameState.units.reserve[sourceIndex];
                    }

                    // 禁止将机关单位拖拽到备战区
                    if (sourceUnit && sourceUnit.isTrap) {
                        alert('机关单位不能移动到备战区！');
                        return;
                    }

                    const targetUnit = gameState.units.reserve[targetIndex];

                    if (targetUnit && sourceUnit && targetUnit.type === sourceUnit.type && 
                        ((targetUnit.level === sourceUnit.level && targetUnit.level < 3) || 
                        (targetUnit.level + sourceUnit.level === 3))) {
                        // 合并升级
                        mergeUnits(targetUnit, sourceUnit);
                        
                        if (sourceType === 'battlefield') {
                            gameState.units.battleField[sourceIndex] = null;
                        } else {
                            gameState.units.reserve[sourceIndex] = null;
                        }
                    } 
                    // 暗夜女王献祭互动 - 备战区版本
                    else if (targetUnit && sourceUnit && targetUnit.type === 'darkQueen' && !isBattleStarted) {
                        // 检查蝙蝠数量是否已达上限
                        if (targetUnit.batCount >= 5) {
                            alert('暗夜女王的蝙蝠数量已达上限，无法再献祭更多单位！');
                        } else {
                            // 询问玩家是否献祭单位
                            if (confirm(`是否将${unitTypes[sourceUnit.type].name || sourceUnit.type}献祭给暗夜女王？暗夜女王将增加该单位当前攻击力和血量，并获得1只蝙蝠。`)) {
                                // 执行献祭逻辑
                                // 增加暗夜女王的属性
                                targetUnit.currentHP += sourceUnit.currentHP;
                                targetUnit.maxHP += sourceUnit.maxHP / 2; // 增加一半的最大生命值
                                targetUnit.attack += sourceUnit.attack;
                                
                                // 增加蝙蝠数量
                                targetUnit.batCount += 1;
                                
                                // 显示献祭效果
                                const reserveSlot = document.querySelector(`.reserve-slot[data-index="${targetIndex}"]`);
                                if (reserveSlot) {
                                    const sacrificeEffect = document.createElement('div');
                                    sacrificeEffect.className = 'damage-number';
                                    sacrificeEffect.style.color = '#ff0000'; // 红色
                                    sacrificeEffect.style.fontSize = '16px';
                                    sacrificeEffect.textContent = '献祭!';
                                    reserveSlot.appendChild(sacrificeEffect);
                                    
                                    setTimeout(() => {
                                        if (reserveSlot.contains(sacrificeEffect)) {
                                            reserveSlot.removeChild(sacrificeEffect);
                                        }
                                    }, 1500);
                                }
                                
                                // 移除被献祭的单位
                                if (sourceType === 'battlefield') {
                                    gameState.units.battleField[sourceIndex] = null;
                                } else {
                                    gameState.units.reserve[sourceIndex] = null;
                                }
                            }
                        }
                    }
                    else if (!targetUnit && sourceUnit) {
                        // 移动到空格子
                        gameState.units.reserve[targetIndex] = sourceUnit;
                        if (sourceType === 'battlefield') {
                            gameState.units.battleField[sourceIndex] = null;
                        } else if (sourceType === 'cage') {
                            // 清空牢笼
                            gameState.units.cage = null;
                            cageContainer.innerHTML = '';
                            cageContainer.style.backgroundColor = '#666';
                            cageContainer.draggable = false;
                        } else {
                            gameState.units.reserve[sourceIndex] = null;
                        }
                    }
                    updateBattlefieldDisplay();
                    initBattleReserveArea();
                });
                
                // If there's a unit in this slot, display it
                if (gameState.units.reserve[i] !== null) {
                    const unit = gameState.units.reserve[i];
                    slot.style.backgroundColor = unitTypes[unit.type].color;
                    
                    // 清除旧元素
                    const oldHp = slot.querySelector('.unit-hp');
                    const oldAttack = slot.querySelector('.unit-attack');
                    const oldLevel = slot.querySelector('.unit-level');
                    if (oldHp) slot.removeChild(oldHp);
                    if (oldAttack) slot.removeChild(oldAttack);
                    if (oldLevel) slot.removeChild(oldLevel);
                    
                    const hpElement = document.createElement('div');
                    hpElement.className = 'unit-hp';
                    hpElement.innerHTML = `❤️${Math.round(unit.currentHP)}`;
                    slot.appendChild(hpElement);
                    
                    const attackElement = document.createElement('div');
                    attackElement.className = 'unit-attack';
                    attackElement.innerHTML = `${unitTypes[unit.type].icon}${unit.attack}`;
                    slot.appendChild(attackElement);
                    
                    const levelElement = document.createElement('div');
                    levelElement.className = 'unit-level';
                    levelElement.textContent = `Lv${unit.level}`;
                    slot.appendChild(levelElement);
                    

                    
                    // Make unit draggable
                    slot.draggable = true;
                    slot.addEventListener('dragstart', (e) => {
                        const data = {
                            sourceType: 'reserve',
                            sourceIndex: i
                        };
                        e.dataTransfer.setData('application/json', JSON.stringify(data));
                    });
                } else {
                    slot.style.backgroundColor = '#666';
                }
                
                battleReserveArea.appendChild(slot);
            }
        }
        
        // Generate a random unit for the cage
        function generateCageUnit() {
            // 获取当前牢笼的属性
            const cageAttribute = gameState.battle.cageAttribute || 'fire';
            
            // 根据属性筛选单位类型
            // 只选择inPool值为1且与牢笼属性匹配的单位类型
            const types = Object.keys(unitTypes).filter(type => {
                return unitTypes[type].inPool === 1 && 
                       unitTypes[type].element === cageAttribute;
            });
            
            // 如果没有找到匹配的单位类型，则从所有可用单位中随机选择
            let type;
            if (types.length === 0) {
                const allTypes = Object.keys(unitTypes).filter(type => unitTypes[type].inPool === 1);
                type = allTypes[Math.floor(Math.random() * allTypes.length)];

        // Generate enemies based on dungeon level and cage type
        function generateEnemies() {
            // 只选择inPool值为1的单位类型
            const types = Object.keys(unitTypes).filter(type => unitTypes[type].inPool === 1);
            const dungeonLevel = gameState.battle.dungeonLevel;
            let enemyCount = 0;
            
            // Clear existing enemies (保留机关单位)
            for (let i = 0; i < 24; i++) {
                // 如果当前位置是机关单位，则保留
                if (gameState.units.battleField[i] && !gameState.units.battleField[i].isTrap) {
                    gameState.units.battleField[i] = null;
                }
            }
            
            if (gameState.battle.cageType === 'normal') {
                // Normal cage: 1 level-1 unit per dungeon level
                enemyCount = dungeonLevel;
                
                for (let i = 0; i < enemyCount; i++) {
                    const type = types[Math.floor(Math.random() * types.length)];
                    const unit = createUnit(type, 1);
                    
                    // Find empty cell in enemy area
                    let cellIndex;
                    do {
                        cellIndex = Math.floor(Math.random() * 24); // 0-23 is enemy area
                    } while (gameState.units.battleField[cellIndex] !== null);
                    
                    gameState.units.battleField[cellIndex] = unit;
                }
            } else if (gameState.battle.cageType === 'elite') {
                // Elite cage: 1 level-2 unit per dungeon level
                enemyCount = dungeonLevel;
                
                for (let i = 0; i < enemyCount; i++) {
                    const type = types[Math.floor(Math.random() * types.length)];
                    const unit = createUnit(type, 2);
                    
                    // Find empty cell in enemy area
                    let cellIndex;
                    do {
                        cellIndex = Math.floor(Math.random() * 24); // 0-23 is enemy area
                    } while (gameState.units.battleField[cellIndex] !== null);
                    
                    gameState.units.battleField[cellIndex] = unit;
                }
            }
            
            gameState.battle.enemyCount = enemyCount;
        }

                    // 为圣战士添加升仙按钮（仅在战斗未开始时显示）

        // Move unit to battlefield
        function moveUnitToBattlefield(sourceType, sourceIndex, targetIndex) {
            let unit;
            
            if (sourceType === 'reserve') {
                unit = gameState.units.reserve[sourceIndex];
                if (unit) {
                    // Move unit from reserve to battlefield
                    gameState.units.battleField[targetIndex] = unit;
                    // 确保单位有mana属性
                    if (unit.mana === undefined) {
                        unit.mana = 0;
                    }
                    gameState.units.reserve[sourceIndex] = null;
                }
            } else if (sourceType === 'battlefield') {
                unit = gameState.units.battleField[sourceIndex];
                if (unit) {
                    // Move unit within battlefield
                    gameState.units.battleField[targetIndex] = unit;
                    gameState.units.battleField[sourceIndex] = null;
                }
            } else if (sourceType === 'cage') {
                unit = gameState.units.cage;
                if (unit) {
                    // Move unit from cage to battlefield
                    gameState.units.battleField[targetIndex] = unit;
                    // 确保单位有mana属性
                    if (unit.mana === undefined) {
                        unit.mana = 0;
                    }
                    gameState.units.cage = null;
                    
                    // 清空牢笼显示
                    cageContainer.innerHTML = '';
                    cageContainer.style.backgroundColor = '#666';
                    cageContainer.draggable = false;
                }
            }
            
            // Update displays
            initBattleReserveArea();
            updateBattlefieldDisplay();
        }
        
        // 战斗相关状态变量
        let battleInProgress = false;
        let battleTurn = 0;
        let battleUnits = [];
        let currentUnitIndex = 0;
        let battleInterval = null;
        let playerUnitBackup = [];
        
        // 战斗是否已开始的标志
        let isBattleStarted = false;
        
        // 开始战斗
        function startBattleAction() {
            // 设置战斗已开始标志
            isBattleStarted = true;
            
            // 更新战场显示（隐藏龙蛋按钮）
            updateBattlefieldDisplay();
            
            // 重置所有单位的名刀使用状态
            for (let i = 0; i < gameState.units.battleField.length; i++) {
                const unit = gameState.units.battleField[i];
                if (unit) {
                    try {
                        unit.namedBladeUsed = false;
                    } catch (error) {
                        console.error(`重置单位${i}名刀状态时出错:`, error);
                    }
                }
            }
            
            // 触发存钱罐储蓄强化技能
            for (let i = 0; i < gameState.units.battleField.length; i++) {
                const unit = gameState.units.battleField[i];
                if (unit && unit.type === 'piggyBank' && unit.currentHP > 0 && 
                    gameState.traps.piggyBank.advancedSkills && 
                    gameState.traps.piggyBank.advancedSkills.healthBoost) {
                    
                    // 触发储蓄强化技能
                    if (unit.passiveSkills && unit.passiveSkills.healthBoost) {
                        unit.passiveSkills.healthBoost.effect(unit);
                    }
                }
            }
            
            // 检查羁绊
            checkAndApplySynergies();
            
            // 应用水属性共鸣效果
            applyWaterResonanceEffect();
            
            // 应用草属性共鸣效果
            applyGrassResonanceEffect();

            // 应用拳击手的血怒效果
            for (let i = 0; i < gameState.units.battleField.length; i++) {
                const unit = gameState.units.battleField[i];
                if (unit && unit.type === 'fire' && unit.level >= 3 && unit.currentHP > 0) {
                    // 应用血怒效果
                    if (unitTypes.fire.passiveSkills && unitTypes.fire.passiveSkills.bloodRage) {
                        unitTypes.fire.passiveSkills.bloodRage.applyBloodRage(unit);
                        // 更新单位显示
                        updateUnitDisplay(i);
                    }
                }
            }

            // 检查玩家是否有单位在战场上
            let playerUnitCount = 0;
            for (let i = 24; i < 48; i++) {
                if (gameState.units.battleField[i] !== null) {
                    playerUnitCount++;
                }
            }
            
            if (playerUnitCount === 0) {
                alert('请至少放置一个单位到战场上！');
                return;
            }
            
            // 如果战斗已经结束，按钮变为回到地图
            if (battleButton.textContent === '回到地图') {
                // 检查是否有血量为0的单位在战场上
                let deadUnitsOnField = false;
                for (let i = 24; i < 48; i++) {
                    const unit = gameState.units.battleField[i];
                    if (unit && unit.currentHP <= 0) {
                        deadUnitsOnField = true;
                        break;
                    }
                }
                
                if (deadUnitsOnField) {
                    alert('请将阵亡的单位移动到备战区！');
                    return;
                }
                
                // 清理所有傀儡
                if (unitTypes.earthPup && unitTypes.earthPup.skill) {
                    unitTypes.earthPup.skill.cleanupAllPuppets();
                }
                
                // 备份单位信息
                backupUnitInfo();
                showScreen('dungeon-map');
                return;
            }
            
            // 禁用战斗按钮和单位回复按钮以及逃跑按钮
            battleButton.disabled = true;
            battleButton.textContent = '战斗进行中';
            document.getElementById('heal-button').disabled = true;
            document.getElementById('escape-button').disabled = true;
            document.getElementById('escape-button').style.backgroundColor = '#888';
            battleInProgress = true;
            battleTurn = 0;
            
            // 准备战斗单位列表（按速度排序）
            prepareBattleUnits();
            
            // 触发圣旗团结之力技能
            for (let i = 0; i < gameState.units.battleField.length; i++) {
                const unit = gameState.units.battleField[i];
                try {
                    if (unit && unit.type === 'holyFlag' && unit.currentHP > 0 && 
                        gameState.traps.holyFlag && gameState.traps.holyFlag.advancedSkills && 
                        gameState.traps.holyFlag.advancedSkills.unityStrength) {

                        // 触发团结之力技能
                        if (unitTypes.holyFlag.passiveSkills && unitTypes.holyFlag.passiveSkills.unityStrength) {
                            console.log('触发圣旗团结之力技能');
                            unitTypes.holyFlag.passiveSkills.unityStrength.effect(unit, i);
                        }
                    }
                } catch (error) {
                    console.error("触发圣旗团结之力技能时出错:", error);
                }
            }
            
            // 重置修女单位的复活技能状态
            if (unitTypes.grassNun && unitTypes.grassNun.passiveSkills && unitTypes.grassNun.passiveSkills.resurrection) {
                unitTypes.grassNun.passiveSkills.resurrection.reset();
            }
            
            // 傀儡师技能：傀儡
            // 清理现有傀儡
            if (unitTypes.earthPup && unitTypes.earthPup.skill) {
                unitTypes.earthPup.skill.cleanupAllPuppets();
                
                // 遍历傀儡师，创建傀儡
                for (let i = 0; i < battleUnits.length; i++) {
                    const unitData = battleUnits[i];
                    if (unitData.unit && unitData.unit.type === 'earthPup' && unitData.unit.currentHP > 0) {
                        unitTypes.earthPup.skill.createPuppet(unitData);
                    }
                }
            }
            
            // 开始战斗循环
            battleInterval = setInterval(battleTurnLoop, 1000);
        }
        
        // 准备战斗单位列表
        function prepareBattleUnits() {
            battleUnits = [];
            
            // 收集所有战场上的单位
            for (let i = 0; i < 48; i++) {
                const unit = gameState.units.battleField[i];
                if (unit) {
                    battleUnits.push({
                        unit: unit,
                        index: i,
                        isEnemy: i < 24, // 0-23是敌方区域，24-47是玩家区域
                        hasAttacked: false
                    });
                }
            }
            
            // 初始化水魔法师技能
            for (let i = 0; i < battleUnits.length; i++) {
                const unitData = battleUnits[i];
                if (unitData.unit && unitData.unit.type === 'waterMage' && unitData.unit.currentHP > 0) {
                    const waterMageSkill = unitTypes['waterMage'].skill;
                    waterMageSkill.effect(unitData.unit, unitData.index);
                }
            }
            
            // 触发水属性消防员技能"孤身"
            for (let i = 0; i < battleUnits.length; i++) {
                    const unitData = battleUnits[i];
                    if (unitData.unit && unitData.unit.type === 'water' && 
                        unitData.unit.level >= 3 && unitData.unit.currentHP > 0 && 
                        unitTypes.water.passiveSkills && unitTypes.water.passiveSkills.solitude) {
                        // 触发孤身技能
                        unitTypes.water.passiveSkills.solitude.applyBoost(unitData.unit, unitData);
                    }
            }
            
            // 使用sortBattleUnitsBySpeed函数按速度排序
            sortBattleUnitsBySpeed();
            
            // 触发暗夜女王蝙蝠释放被动技能
            for (let i = 0; i < battleUnits.length; i++) {
                const unitData = battleUnits[i];
                if (unitData.unit && unitData.unit.type === 'darkQueen' && unitData.unit.currentHP > 0) {
                    // 初始化蝙蝠显示
                    unitTypes.darkQueen.updateOwnBatDisplay(unitData.index);
                    
                    // 触发蝙蝠释放技能
                    if (unitTypes.darkQueen.passiveSkills && unitTypes.darkQueen.passiveSkills.batRelease) {
                        console.log('暗夜女王释放蝙蝠');
                        unitTypes.darkQueen.passiveSkills.batRelease.effect(unitData.unit);
                    }
                }
            }
            
            currentUnitIndex = 0;
        }
        
        // 技能是否正在执行
        let isSkillExecuting = false;
        
        // 战斗回合循环
        function battleTurnLoop() {
            // 技能执行中跳过此回合
            if (isSkillExecuting) {
                return;
            }
            
            // 检查战斗结束
            if (checkBattleEnd()) {
                clearInterval(battleInterval);
                // 战斗结束重置火焰法师攻击力
                endBattleRound();
                endBattle();
                return;
            }
            
            // 所有单位都行动后进入下一回合
            if (currentUnitIndex >= battleUnits.length) {
                battleTurn++;
                // 重置单位攻击状态
                battleUnits.forEach(unitData => unitData.hasAttacked = false);
                
                // 使用统一的排序函数重新排序单位
                sortBattleUnitsBySpeed();
                
                // 重置当前单位索引
                currentUnitIndex = 0;
                
                // 应用火属性共鸣效果
                if (typeof applyFireResonanceEffect === 'function') {
                    applyFireResonanceEffect();
                }
                
                // 稻草人自我修复技能
                if (unitTypes.scarecrow && unitTypes.scarecrow.passiveSkills && unitTypes.scarecrow.passiveSkills.regeneration) {
                    unitTypes.scarecrow.passiveSkills.regeneration.applyRegeneration();
                }
                
                // 稻草人复活技能
                if (unitTypes.scarecrow && unitTypes.scarecrow.passiveSkills && unitTypes.scarecrow.passiveSkills.resurrection) {
                    unitTypes.scarecrow.passiveSkills.resurrection.updateResurrectionCountdown();
                }
                
                // 圣旗复苏之光技能
                if (unitTypes.holyFlag && unitTypes.holyFlag.passiveSkills && 
                    unitTypes.holyFlag.passiveSkills.resurrectionLight && 
                    unitTypes.holyFlag.passiveSkills.resurrectionLight.shouldTrigger()) {
                    console.log(`回合${battleTurn}：触发圣旗复苏之光技能检查`);
                    unitTypes.holyFlag.passiveSkills.resurrectionLight.effect();
                }
                
                // 火药桶自动蓄力技能
                for (let i = 0; i < battleUnits.length; i++) {
                    const unitData = battleUnits[i];
                    if (unitData.unit && 
                        unitData.unit.type === 'barrel' && 
                        unitData.unit.currentHP > 0 &&
                        gameState.traps.barrel.advancedSkills && 
                        gameState.traps.barrel.advancedSkills.autoCharge) {
                        
                        // 更新蓄力状态
                        unitTypes.barrel.passiveSkills.autoCharge.updateCharge(unitData.unit, unitData.index);
                    }
                }
                
                // 存钱罐列计数技能
                for (let i = 0; i < battleUnits.length; i++) {
                    const unitData = battleUnits[i];
                    if (unitData.unit && 
                        unitData.unit.type === 'piggyBank' && 
                        unitData.unit.currentHP > 0 &&
                        gameState.traps.piggyBank.advancedSkills && 
                        gameState.traps.piggyBank.advancedSkills.columnCounter) {
                        
                        // 触发列计数技能
                        unitTypes.piggyBank.passiveSkills.columnCounter.effect(unitData.unit);
                    }
                }
                
                // 龙蛋孵化逻辑：每回合结束后，有50%的概率孵化成巨龙
                for (let i = 0; i < battleUnits.length; i++) {
                    const unitData = battleUnits[i];
                    // 检查是否是龙蛋单位
                    if (unitData && unitData.unit && unitData.unit.type === 'dragonEgg' && unitData.unit.currentHP > 0) {
                        // 50%概率孵化
                        console.log('龙蛋孵化检查');
                        if (Math.random() < 0.5) {
                            console.log('龙蛋孵化成功！');
                            
                            // 创建巨龙单位，使用createUnit函数确保所有属性都被正确设置
                            const dragon = createUnit('dragon', 1);
                            
                            // 确保巨龙单位有所有必要的属性
                            if (!dragon.statusEffects) dragon.statusEffects = {};
                            if (!dragon.passiveSkills) dragon.passiveSkills = {};
                            
                            console.log('创建的巨龙单位:', dragon);
                            
                            // 完全替换龙蛋为巨龙
                            gameState.units.battleField[unitData.index] = dragon;
                            unitData.unit = dragon;
                            
                            // 更新单位显示
                            updateUnitDisplay(unitData.index);
                                                        
                        }
                    }
                }
                
                // 更新状态效果持续时间
                for (let i = 0; i < battleUnits.length; i++) {
                    const unitData = battleUnits[i];
                    if (unitData.unit && unitData.unit.statusEffects) {
                        // 更新无法行动状态
                        if (unitData.unit.statusEffects.cantAct) {
                            const effect = unitData.unit.statusEffects.cantAct;
                            if (battleTurn - effect.startTurn >= effect.duration) {
                                // 状态效果已过期，移除
                                delete unitData.unit.statusEffects.cantAct;
                                
                                // 移除水牢视觉效果
                                const unitCell = document.querySelector(`.grid-cell[data-index="${unitData.index}"]`);
                                if (unitCell) {
                                    const prisonEffect = unitCell.querySelector('.water-prison-effect');
                                    if (prisonEffect) {
                                        unitCell.removeChild(prisonEffect);
                                    }
                                    
                                    // 移除无法行动状态图标
                                    const cantActTurnsElement = unitCell.querySelector('.cant-act-turns');
                                    if (cantActTurnsElement) {
                                        unitCell.removeChild(cantActTurnsElement);
                                    }
                                }
                            } else {
                                // 更新无法行动状态显示
                                updateUnitDisplay(unitData.index);
                            }
                        }
                        
                        // 更新隐身状态
                        if (unitData.unit.statusEffects.invisible) {
                            const effect = unitData.unit.statusEffects.invisible;
                            if (battleTurn - effect.startTurn >= effect.duration) {
                                // 状态效果已过期，移除
                                if (unitData.unit.type === 'waterDiver' && unitTypes.waterDiver.passiveSkills.diving) {
                                    unitTypes.waterDiver.passiveSkills.diving.removeInvisibility(unitData.unit);
                                } else {
                                    delete unitData.unit.statusEffects.invisible;
                                    
                                    // 恢复单位显示
                                    const unitCell = document.querySelector(`.grid-cell[data-index="${unitData.index}"]`);
                                    if (unitCell) {
                                        unitCell.style.opacity = '1';
                                    }
                                }
                            }
                        }
                    }
                }
                
                // 触发消防员3级技能"孤身"
                for (let i = 0; i < battleUnits.length; i++) {
                    const unitData = battleUnits[i];
                    if (unitData.unit && unitData.unit.type === 'water' && 
                        unitData.unit.level >= 3 && unitData.unit.currentHP > 0 && 
                        unitTypes.water.passiveSkills && unitTypes.water.passiveSkills.solitude) {
                        // 触发孤身技能
                        unitTypes.water.passiveSkills.solitude.applyBoost(unitData.unit, unitData);
                    }
                }
                
                // 更新拳击手的血怒效果
                for (let i = 0; i < battleUnits.length; i++) {
                    const unitData = battleUnits[i];
                    if (unitData.unit && unitData.unit.type === 'fire' && 
                        unitData.unit.level >= 3 && unitData.unit.currentHP > 0 && 
                        unitTypes.fire.passiveSkills && unitTypes.fire.passiveSkills.bloodRage) {
                        // 应用血怒效果
                        unitTypes.fire.passiveSkills.bloodRage.applyBloodRage(unitData.unit);
                        // 更新显示
                        updateUnitDisplay(unitData.index);
                    }
                }
                
                // 触发水魔法师自愈技能
                for (let i = 0; i < battleUnits.length; i++) {
                    const unitData = battleUnits[i];
                    if (unitData.unit && unitData.unit.type === 'waterMage' && 
                        unitData.unit.level >= 3 && unitData.unit.currentHP > 0) {
                        
                        const selfHealingSkill = unitTypes.waterMage.passiveSkills.selfHealing;
                        const waterMageSkill = unitTypes.waterMage.skill;
                        let linkedUnit = null;
                        
                        if (waterMageSkill.linkedAllies[unitData.index] && 
                            waterMageSkill.linkedAllies[unitData.index].linkedAllyIndex !== null) {
                            
                            const linkedAllyIndex = waterMageSkill.linkedAllies[unitData.index].linkedAllyIndex;
                            const linkedAllyData = battleUnits.find(unit => unit.index === linkedAllyIndex);
                            
                            if (linkedAllyData && linkedAllyData.unit && linkedAllyData.unit.currentHP > 0) {
                                linkedUnit = linkedAllyData.unit;
                            }
                        }
                        
                        // 自愈效果
                        selfHealingSkill.effect(unitData.unit, linkedUnit);
                        
                        // 更新单位显示
                        updateUnitDisplay(unitData.index);
                        
                        // 如果有链接的盟友，也更新其显示
                        if (linkedUnit && waterMageSkill.linkedAllies[unitData.index]) {
                            updateUnitDisplay(waterMageSkill.linkedAllies[unitData.index].linkedAllyIndex);
                            
                            // 治疗效果
                            const healAmount = Math.round(unitTypes.waterMage.hp * 0.1);
                            
                            // 在水魔法师上显示治疗效果
                            const mageCell = document.querySelector(`.grid-cell[data-index="${unitData.index}"]`);
                            if (mageCell) {
                                const healNumber = document.createElement('div');
                                healNumber.className = 'damage-number';
                                healNumber.style.color = '#4CAF50'; // 绿色
                                healNumber.textContent = `+${healAmount}`;
                                mageCell.appendChild(healNumber);
                                
                                setTimeout(() => {
                                    if (mageCell.contains(healNumber)) {
                                        mageCell.removeChild(healNumber);
                                    }
                                }, 1000);
                            }
                            
                            // 在链接盟友上显示治疗效果
                            const linkedCell = document.querySelector(`.grid-cell[data-index="${waterMageSkill.linkedAllies[unitData.index].linkedAllyIndex}"]`);
                            if (linkedCell) {
                                const linkedHealNumber = document.createElement('div');
                                linkedHealNumber.className = 'damage-number';
                                linkedHealNumber.style.color = '#4CAF50'; // 绿色
                                linkedHealNumber.textContent = `+${healAmount}`;
                                linkedCell.appendChild(linkedHealNumber);
                                
                                setTimeout(() => {
                                    if (linkedCell.contains(linkedHealNumber)) {
                                        linkedCell.removeChild(linkedHealNumber);
                                    }
                                }, 1000);
                            }
                        }
                    }
                }
                
                // 更新状态效果持续时间
                battleUnits.forEach(unitData => {
                    // 检查并更新无法行动状态
                    if (unitData.unit.statusEffects && unitData.unit.statusEffects.cantAct) {
                        const cantActEffect = unitData.unit.statusEffects.cantAct;
                        const elapsedTurns = battleTurn - cantActEffect.startTurn;
                        
                        // 状态效果结束移除效果
                        if (elapsedTurns >= cantActEffect.duration) {
                            delete unitData.unit.statusEffects.cantAct;
                            
                            // 移除视觉效果
                            const unitCell = document.querySelector(`.grid-cell[data-index="${unitData.index}"]`);
                            if (unitCell) {
                                const effectElement = unitCell.querySelector('.water-prison-effect');
                                if (effectElement) {
                                    unitCell.removeChild(effectElement);
                                }
                            }
                        } else {
                            // 更新无法行动状态显示
                            updateUnitDisplay(unitData.index);
                        }
                    }
                    
                    // 处理中毒状态
                    if (unitData.unit.statusEffects && unitData.unit.statusEffects.poisoned) {
                        const poisonEffect = unitData.unit.statusEffects.poisoned;
                        const elapsedTurns = battleTurn - poisonEffect.startTurn;
                        
                        // 应用中毒伤害
                        if (unitData.unit.currentHP > 0) {
                            const poisonDamage = poisonEffect.damage;
                            unitData.unit.currentHP = Math.max(0, unitData.unit.currentHP - poisonDamage); // 允许致死
                            
                            // 显示中毒伤害
                            const unitCell = document.querySelector(`.grid-cell[data-index="${unitData.index}"]`);
                            if (unitCell) {
                                const damageNumber = document.createElement('div');
                                damageNumber.className = 'damage-number';
                                damageNumber.style.color = '#66BB6A'; // 绿色
                                damageNumber.textContent = `-${poisonDamage}`;
                                unitCell.appendChild(damageNumber);
                                
                                setTimeout(() => {
                                    if (unitCell.contains(damageNumber)) {
                                        unitCell.removeChild(damageNumber);
                                    }
                                }, 1000);
                                
                                // 更新单位显示
                                updateUnitDisplay(unitData.index);
                            }
                            
                            // 检查是否有2级或以上的生化员在场，触发疲倦效果
                            const hasBiochemistLv2 = battleUnits.some(data => 
                                data.unit && 
                                data.unit.type === 'grassBiochemist' && 
                                data.unit.level >= 2 && 
                                data.unit.currentHP > 0 && 
                                data.isEnemy !== unitData.isEnemy
                            );
                            
                            if (hasBiochemistLv2) {
                                // 触发疲倦效果，减少蓝量
                                unitTypes.grassBiochemist.passiveSkills.fatigue.effect(unitData.unit);
                            }
                            
                            // 检查单位是否死亡
                            if (unitData.unit.currentHP <= 0) {
                                // 触发单位死亡处理
                                handleUnitDeath(unitData);
                            }
                        }
                        
                        // 状态效果结束移除效果
                        if (elapsedTurns >= poisonEffect.duration) {
                            delete unitData.unit.statusEffects.poisoned;
                            
                            // 移除视觉效果
                            const unitCell = document.querySelector(`.grid-cell[data-index="${unitData.index}"]`);
                            if (unitCell) {
                                const effectElement = unitCell.querySelector('.poison-effect');
                                if (effectElement) {
                                    unitCell.removeChild(effectElement);
                                }
                            }
                        }
                    }
                    
                    // 处理灼烧状态
                    if (unitData.unit.statusEffects && unitData.unit.statusEffects.burned) {
                        const burnEffect = unitData.unit.statusEffects.burned;
                        const elapsedTurns = battleTurn - burnEffect.startTurn;
                        
                        // 应用灼烧伤害
                        if (unitData.unit.currentHP > 0) {
                            const burnDamage = burnEffect.damage;
                            unitData.unit.currentHP = Math.max(0, unitData.unit.currentHP - burnDamage); // 允许致死
                            
                            // 显示灼烧伤害
                            const unitCell = document.querySelector(`.grid-cell[data-index="${unitData.index}"]`);
                            if (unitCell) {
                                const damageNumber = document.createElement('div');
                                damageNumber.className = 'damage-number';
                                damageNumber.style.color = '#FF5252'; // 红色
                                damageNumber.textContent = `-${burnDamage}`;
                                unitCell.appendChild(damageNumber);
                                
                                setTimeout(() => {
                                    if (unitCell.contains(damageNumber)) {
                                        unitCell.removeChild(damageNumber);
                                    }
                                }, 1000);
                                
                                // 更新单位显示
                                updateUnitDisplay(unitData.index);
                            }
                            
                            // 检查单位是否死亡
                            if (unitData.unit.currentHP <= 0) {
                                // 触发单位死亡处理
                                handleUnitDeath(unitData);
                            }
                        }
                        
                        // 状态效果结束移除效果
                        if (elapsedTurns >= burnEffect.duration) {
                            delete unitData.unit.statusEffects.burned;
                            
                            // 移除视觉效果
                            const unitCell = document.querySelector(`.grid-cell[data-index="${unitData.index}"]`);
                            if (unitCell) {
                                const effectElement = unitCell.querySelector('.burn-effect');
                                if (effectElement) {
                                    unitCell.removeChild(effectElement);
                                }
                            }
                        }
                    }
                });
                
                currentUnitIndex = 0;
                return;
            }
            
            const unitData = battleUnits[currentUnitIndex];
            
            // 跳过已攻击单位
            if (unitData.hasAttacked) {
                currentUnitIndex++;
                return;
            }
            
            // 跳过已死亡单位
            if (unitData.unit.currentHP <= 0) {
                currentUnitIndex++;
                return;
            }
            
            // 单位是否无法行动
            if (unitData.unit.statusEffects && unitData.unit.statusEffects.cantAct) {
                unitData.hasAttacked = true;
                currentUnitIndex++;
                return;
            }
            
            // 稻草人不进行主动攻击
            if (unitData.unit.isTrap === true) {
                unitData.hasAttacked = true;
                currentUnitIndex++;
                return;
            }
            
            // 执行攻击
            performAttack(unitData);
            
            // 标记为已攻击并移动到下一个单位
            unitData.hasAttacked = true;
            currentUnitIndex++;
        }
        
        // 执行攻击
        function performAttack(attackerData) {
            const attackerUnit = attackerData.unit;
            const attackerIndex = attackerData.index;
            const isEnemy = attackerData.isEnemy;
            const baseStats = unitTypes[attackerUnit.isPuppet ? attackerUnit.originalType : attackerUnit.type];
            
            // 检查是否被减速，并标记已行动
            if (unitTypes.earthGuardian.passiveSkills && unitTypes.earthGuardian.passiveSkills.slowdown && 
                unitTypes.earthGuardian.passiveSkills.slowdown.slowedUnits[attackerIndex]) {
                unitTypes.earthGuardian.passiveSkills.slowdown.slowedUnits[attackerIndex].hasActed = true;
                // 重置速度
                unitTypes.earthGuardian.passiveSkills.slowdown.resetSpeed(attackerData);
            }
            
            // 检查是否有被花仙子激励的单位
            if (unitTypes.grass.passiveSkills && unitTypes.grass.passiveSkills.inspire && 
                    unitTypes.grass.passiveSkills.inspire.inspiredUnits[attackerData.index]) {
                    // 重置被激励单位的速度
                    unitTypes.grass.passiveSkills.inspire.resetSpeed(attackerData);
                }
                
            // 辅助不发动普攻（包括辅助类型的傀儡），但巨龙除外
            if (baseStats.job === 'support' && attackerUnit.type !== 'dragon') {
                // 处理花仙子鼓舞
                if (attackerUnit.type === 'grass') {
                    const allyTarget = findNearestAlly(attackerIndex, isEnemy);
                    if (allyTarget) {
                        const success = baseStats.skill.effect(attackerUnit, allyTarget);
                        if (success) {
                            // 显示增益效果
