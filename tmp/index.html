                            const attackerCell = document.querySelector(`.grid-cell[data-index="${attackerIndex}"]`);
                            const targetCell = document.querySelector(`.grid-cell[data-index="${allyTarget.index}"]`);
                            if (attackerCell && targetCell) {
                                const buffNumber = document.createElement('div');
                                buffNumber.className = 'damage-number';
                                buffNumber.style.color = '#4CAF50'; // 绿色
                                buffNumber.textContent = `+${attackerUnit.attack}`;
                                targetCell.appendChild(buffNumber);
                                
                                setTimeout(() => {
                                    if (targetCell.contains(buffNumber)) {
                                        targetCell.removeChild(buffNumber);
                                    }
                                }, 1000);
                                
                                // 更新蓝量显示
                                updateUnitDisplay(allyTarget.index);
                                
                                // 2级激励技能：提升目标速度
                                if (attackerUnit.level >= 2 && unitTypes.grass.passiveSkills.inspire) {
                                    unitTypes.grass.passiveSkills.inspire.applyInspire(allyTarget.unit, allyTarget);
                                    
                                    // 显示激励效果
                                    const inspireText = document.createElement('div');
                                    inspireText.className = 'damage-number';
                                    inspireText.style.color = '#66BB6A'; // 绿色
                                    inspireText.textContent = '激励!';
                                    targetCell.appendChild(inspireText);
                                    
                                    setTimeout(() => {
                                        if (targetCell.contains(inspireText)) {
                                            targetCell.removeChild(inspireText);
                                        }
                                    }, 1000);
                                }
                            }
                        }
                    }
                }

                // 莲花仙女特殊处理：不需要目标，直接发动治疗
                if (attackerUnit.type === 'lotusNymph') {
                    // 检查蓝量是否足够发动技能
                    if (attackerUnit.mana >= 100 && unitTypes.lotusNymph.skill) {
                        // 发动主动技能"不染"
                        console.log('莲花仙女发动技能：不染');
                        attackerUnit.mana -= 100; // 消耗100蓝量                        
                        unitTypes.lotusNymph.skill.effect(attackerUnit, null);
                    } else {
                        // 蓝量不足，使用普通治疗
                        console.log('莲花仙女发动普通治疗');
                        unitTypes.lotusNymph.normalAttack(attackerUnit, null);
                    }
                    
                    // 更新显示
                    for (let i = 0; i < battleUnits.length; i++) {
                        if (battleUnits[i].unit.currentHP > 0) {
                            updateUnitDisplay(battleUnits[i].index);
                        }
                    }
                }
                
                // 生命之母特殊处理：不需要目标，直接发动治疗或禁锢
                if (attackerUnit.type === 'motherOfLife') {
                    // 检查蓝量是否足够发动技能
                    if (attackerUnit.mana >= 100 && unitTypes.motherOfLife.skill) {
                        // 发动主动技能"禁锢"
                        console.log('生命之母发动技能：禁锢');
                        attackerUnit.mana -= 100; // 消耗100蓝量
                        
                        // 显示技能效果
                        const attackerCell = document.querySelector(`.grid-cell[data-index="${attackerIndex}"]`);
                        if (attackerCell) {
                            const skillIndicator = document.createElement('div');
                            skillIndicator.className = 'damage-number';
                            skillIndicator.style.color = '#8BC34A'; // 草绿色
                            skillIndicator.textContent = `禁锢!`;
                            attackerCell.appendChild(skillIndicator);
                            
                            setTimeout(() => {
                                if (attackerCell.contains(skillIndicator)) {
                                    attackerCell.removeChild(skillIndicator);
                                }
                            }, 1500);
                        }
                        
                        // 执行技能效果
                        unitTypes.motherOfLife.skill.effect(attackerUnit, null);
                    } else {
                        // 蓝量不足，使用普通治疗
                        console.log('生命之母发动普通治疗');
                        unitTypes.motherOfLife.normalAttack(attackerUnit, null);
                    }
                    
                    // 更新显示
                    for (let i = 0; i < battleUnits.length; i++) {
                        if (battleUnits[i].unit.currentHP > 0) {
                            updateUnitDisplay(battleUnits[i].index);
                        }
                    }
                }
                return;
            }
            
            // 寻找攻击目标
            let target;
            if (attackerUnit.job === 'assassin') {
                // 刺客优先攻击同一列距自己最远的对方单位
                target = findFarthestTarget(attackerIndex, isEnemy);
            } else {
                // 战士/远程/法师的攻击目标为默认情况
                target = findNearestTarget(attackerIndex, isEnemy);
            }
            
            if (!target) return; // 没有目标可攻击
            
            // 获取攻击者和目标的DOM元素
            const attackerCell = document.querySelector(`.grid-cell[data-index="${attackerIndex}"]`);
            const targetCell = document.querySelector(`.grid-cell[data-index="${target.index}"]`);
            
            if (!attackerCell || !targetCell) return;
            
            // 是否有足够蓝量发动技能
            let useSkill = false;
            if (attackerUnit.mana >= 100 && baseStats.skill && baseStats.skill.type === 'active') {
                useSkill = true;
                attackerUnit.mana -= 100; // 消耗100蓝量
                
                // 技能触发效果
                const skillIndicator = document.createElement('div');
                skillIndicator.className = 'damage-number';
                skillIndicator.style.color = '#FFD700'; // 金色
                skillIndicator.textContent = `${baseStats.skill.name}!`;
                attackerCell.appendChild(skillIndicator);
                
                setTimeout(() => {
                    if (attackerCell.contains(skillIndicator)) {
                        attackerCell.removeChild(skillIndicator);
                    }
                }, 1000);
            }
            
            // 攻击动画
            animateAttack(attackerCell, targetCell, () => {
                let damage = 0;
                
                if (useSkill) {
                    // 使用技能
                    if (attackerUnit.type === 'fireSpear') {
                        // 红缨枪灼烧技能
                        damage = baseStats.skill.effect(attackerUnit, target.unit);
                    }else if (attackerUnit.type === 'frostMage') {
                        // 冰霜术士灼烧技能
                        damage = baseStats.skill.effect(attackerUnit, target.unit);
                    }else if (attackerUnit.type === 'lavaGuardian') {
                        // 熔岩守护者列阵技能
                        damage = baseStats.skill.effect(attackerUnit);                        
                    } else if (attackerUnit.type === 'holyWarrior') {
                        // 圣骑士无敌技能
                        console.log('圣骑士发动无敌技能');
                        damage = baseStats.skill.effect(attackerUnit);
                    } else if (attackerUnit.type === 'holyAngel') {
                        // 圣天使圣盾技能
                        console.log('圣天使发动圣盾技能');
                        damage = baseStats.skill.effect(attackerUnit);
                    } else if (attackerUnit.type === 'darkQueen') {
                        // 暗夜女王吸血技能
                        console.log('暗夜女王发动吸血技能');
                        damage = baseStats.skill.effect(attackerUnit);                        
                    } else if (attackerUnit.type === 'fire') {
                        // 拳击手暴击
                        damage = baseStats.skill.effect(attackerUnit, target.unit);
                        applyDamage(target, damage, targetCell, attackerData);
                    } else if (attackerUnit.type === 'waterDiver') {
                        // 潜水员水牢
                        damage = baseStats.skill.effect(attackerUnit, target.unit);
                        applyDamage(target, damage, targetCell, attackerData);
                    } else if (attackerUnit.type === 'water') {
                        // 消防员水流
                        unitTypes.water.skill.executeWaterFlowSkill(attackerUnit, target, attackerIndex, isEnemy);
                    } else if (attackerUnit.type === 'electric') {
                        // 雷电术士天雷，延时攻击
                        unitTypes.electric.skill.executeThunderAttack(attackerUnit, attackerIndex, isEnemy);
                    } else if (attackerUnit.type === 'electricThor') {
                        // 雷神重锤
                        unitTypes.electricThor.skill.executeHammerSkill(attackerUnit, target, targetCell, attackerData);
                    } else if (attackerUnit.type === 'electricFlash') {
                        // 雷电侠闪击
                        unitTypes.electricFlash.skill.executeFlashAttack(attackerUnit, attackerIndex, isEnemy);
                    } else if (attackerUnit.type === 'earthGuardian') {
                        // 防卫者护盾
                        baseStats.skill.effect(attackerData);
                    } else if (attackerUnit.type === 'fireGunner') {
                        // 火枪手双发
                        unitTypes.fireGunner.skill.executeDoubleShot(attackerUnit, attackerIndex, attackerData, isEnemy);
                    } else if (attackerUnit.type === 'grassBiochemist') {
                        // 生化员病毒
                        damage = baseStats.skill.effect(attackerUnit, target.unit);
                        applyDamage(target, damage, targetCell, attackerData);
                    } else if (attackerUnit.type === 'grassNun') {
                        // 修女回复
                        baseStats.skill.effect(attackerUnit);
                    } else if (attackerUnit.type === 'thunderArcher') {
                        // 雷霆射手连射
                        unitTypes.thunderArcher.skill.executeTripleShot(attackerUnit, attackerIndex, attackerData, isEnemy);
                    } else if (attackerUnit.type === 'fireMage') {
                        // 火焰法师火球
                        unitTypes.fireMage.skill.executeFireballSkill(attackerUnit, target, attackerIndex, attackerData, isEnemy);
                    }
                } else {
                    // 普通攻击
                    if (attackerUnit.type === 'fireSpear' && unitTypes.fireSpear.normalAttack) {
                        // 使用红缨枪的特殊普通攻击
                        damage = unitTypes.fireSpear.normalAttack(attackerUnit, target.unit);
                    } else if (attackerUnit.type === 'thunderArcher' && unitTypes.thunderArcher.normalAttack) {
                        // 使用雷霆射手的特殊普通攻击
                        damage = unitTypes.thunderArcher.normalAttack(attackerUnit, target.unit);
                    } else if (attackerUnit.type === 'frostMage' && unitTypes.frostMage.normalAttack) {
                        // 使用冰霜术士的特殊普通攻击
                        damage = unitTypes.frostMage.normalAttack(attackerUnit, target.unit);
                    } else if (attackerUnit.type ==='lavaGuardian' && unitTypes.lavaGuardian.normalAttack) {
                        // 使用熔岩守护者的特殊普通攻击
                        damage = unitTypes.lavaGuardian.normalAttack(attackerUnit, target.unit);
                    } else if (attackerUnit.type === 'dragon' && unitTypes.dragon.normalAttack) {
                        // 使用巨龙的特殊普通攻击
                        damage = unitTypes.dragon.normalAttack(attackerUnit, target.unit);
                    } else if (attackerUnit.type === 'holyWarrior' && unitTypes.holyWarrior.normalAttack) {
                        // 使用圣骑士的特殊普通攻击
                        damage = unitTypes.holyWarrior.normalAttack(attackerUnit, target.unit);
                    } else if (attackerUnit.type === 'holyAngel' && unitTypes.holyAngel.normalAttack) {
                        // 使用圣天使的特殊普通攻击
                        damage = unitTypes.holyAngel.normalAttack(attackerUnit, target.unit);
                    } else if (attackerUnit.type === 'darkQueen' && unitTypes.darkQueen.normalAttack) {
                        // 使用暗夜女王的特殊普通攻击
                        damage = unitTypes.darkQueen.normalAttack(attackerUnit, target.unit);
                    } else {
                        damage = attackerUnit.attack;
                    }
                    
                    // 潜水员"窒息"
                    if (attackerUnit.type === 'waterDiver' && attackerUnit.level >= 2 && 
                        target.unit.statusEffects && target.unit.statusEffects.cantAct) {
                        // 触发
                        damage = unitTypes.waterDiver.passiveSkills.suffocation.effect(attackerUnit, target.unit);
                        
                        // 显示效果
                        const suffocationIndicator = document.createElement('div');
                        suffocationIndicator.className = 'damage-number';
                        suffocationIndicator.style.color = '#4FC3F7'; // 蓝色
                        suffocationIndicator.textContent = '窒息!';
                        attackerCell.appendChild(suffocationIndicator);
                        
                        setTimeout(() => {
                            if (attackerCell.contains(suffocationIndicator)) {
                                attackerCell.removeChild(suffocationIndicator);
                            }
                        }, 1000);
                    }
                    
                    // 属性克制检查
                    if (weaknesses[target.unit.element] === attackerUnit.element) {
                        damage *= 1.5; // 克制伤害提升50%
                    } else if (weaknesses[attackerUnit.element] === target.unit.element) {
                        damage *= 0.5; // 被克制时伤害减少50%
                    }
                    
                    applyDamage(target, damage, targetCell, attackerData);
                    
                    // 增加蓝量（考虑辅助羁绊加成）
                    let manaRegenAmount = attackerUnit.manaRegen;
                    if (attackerUnit.bonusManaRegen) {
                        manaRegenAmount += attackerUnit.bonusManaRegen;
                    }
                    
                    // 考虑草属性共鸣削弱效果
                    if (attackerUnit.grassResonanceDebuff) {
                        // 削弱回蓝量50%
                        manaRegenAmount = Math.floor(manaRegenAmount * 0.5);
                    }
                    
                    attackerUnit.mana = Math.min(300, attackerUnit.mana + manaRegenAmount);
                    
                    // 被攻击单位获得20点蓝量
                    target.unit.mana = Math.min(300, target.unit.mana + 20);
                    
                    // 更新显示
                    for (let i = 0; i < battleUnits.length; i++) {
                        if (battleUnits[i].unit.currentHP > 0) {
                            updateUnitDisplay(battleUnits[i].index);
                        }
                    }
                    
                    // 盗贼偷钱
                    if (attackerUnit.type === 'earth') {
                        const success = baseStats.skill.effect(isEnemy);
                        if (success) {
                            const shellGain = document.createElement('div');
                            shellGain.className = 'damage-number';
                            shellGain.style.color = '#FFD700'; // 金色
                            
                            // 2级解锁被动技能"购置"
                            if (attackerUnit.level >= 2 && baseStats.passiveSkills && baseStats.passiveSkills.purchase) {
                                baseStats.passiveSkills.purchase.effect(attackerUnit);
                                shellGain.textContent = '+1🐚';
                                updateUnitDisplay(attackerIndex);
                            }
                            
                            
                            attackerCell.appendChild(shellGain);
                            
                            setTimeout(() => {
                                if (attackerCell.contains(shellGain)) {
                                    attackerCell.removeChild(shellGain);
                                }
                            }, 1000);
                            
                            if (shellDisplay) {
                                shellDisplay.textContent = `Shells: ${gameState.player.shells}`;
                            }
                        }
                    }
                }
                
                // 检查是否有同列的连弩机关，如果有，触发自动攻击
                triggerCrossbowAutoAttack(attackerIndex);
            });
        }
        
        // 触发同列连弩自动攻击
        function triggerCrossbowAutoAttack(attackerIndex) {
            // 获取攻击者所在列
            const col = attackerIndex % 6;
            const isEnemy = attackerIndex < 24; // 判断攻击者是敌方还是友方
            
            // 查找同列的连弩机关
            for (let row = 0; row < 8; row++) {
                const index = row * 6 + col;
                const unit = gameState.units.battleField[index];
                
                // 连弩机关必须是同一方的，并且存活
                if (unit && unit.type === 'crossbow' && unit.currentHP > 0 && 
                    (index < 24) === isEnemy) {
                    
                    // 跳过自己
                    if (index === attackerIndex) continue;
                    
                    // 触发自动攻击
                    if (unit.passiveSkills && unit.passiveSkills.autoAttack) {
                        unit.passiveSkills.autoAttack.effect(unit, index);
                    }
                }
            }
        }
        
        // 应用伤害并显示
        function applyDamage(target, damage, targetCell, attacker = null) {
            if (target && target.unit && target.unit.statusEffects && target.unit.statusEffects.invincible) {
                // 触发无敌效果抵消伤害
                const invincibleCell = document.querySelector(`.grid-cell[data-index="${target.index}"]`);
                if (invincibleCell) {
                    // 显示无敌触发效果
                    const invincibleTrigger = document.createElement('div');
                    invincibleTrigger.className = 'damage-number';
                    invincibleTrigger.style.color = '#FFD700'; // 金色
                    invincibleTrigger.style.fontSize = '16px';
                    invincibleTrigger.textContent = '无敌抵挡!';
                    invincibleCell.appendChild(invincibleTrigger);
                    
                    setTimeout(() => {
                        if (invincibleCell.contains(invincibleTrigger)) {
                            invincibleCell.removeChild(invincibleTrigger);
                        }
                    }, 1500);
                    
                    // 移除无敌状态和视觉效果
                    delete target.unit.statusEffects.invincible;
                    
                    const invincibleEffect = invincibleCell.querySelector('.invincible-effect');
                    if (invincibleEffect) {
                        invincibleCell.removeChild(invincibleEffect);
                    }
                }
                
                // 不受到伤害
                return;
            }
            
            // 检查稻草人伤害重定向技能
            if (target && target.unit && damage > 0 && !target.unit.isTrap && target.index >= 24) {
                // 只对我方普通单位触发伤害重定向
                if (unitTypes.scarecrow.passiveSkills.damageRedirection && 
                    unitTypes.scarecrow.passiveSkills.damageRedirection.canRedirect(target.index, damage)) {
                    
                    // 检查同列的稻草人是否因重定向而死亡
                    const targetCol = target.index % 6;
                    for (let row = 4; row < 8; row++) {
                        const scarecrowIndex = row * 6 + targetCol;
                        const unit = gameState.units.battleField[scarecrowIndex];
                        
                        // 如果找到稻草人，且稻草人血量为0
                        if (unit && unit.type === 'scarecrow' && unit.currentHP <= 0) {
                            // 查找对应的battleUnits数据
                            for (let i = 0; i < battleUnits.length; i++) {
                                if (battleUnits[i].index === scarecrowIndex) {
                                    // 立即触发死亡处理
                                    console.log(`稻草人(${scarecrowIndex})因伤害重定向死亡，立即触发死亡处理`);
                                    handleUnitDeath(battleUnits[i]);
                                    break;
                                }
                            }
                            break;
                        }
                    }
                    
                    // 伤害已被重定向到稻草人，不需要继续处理
                    return;
                }
            }
            
            // 电属性共鸣闪避效果
            if (target && target.unit && damage > 0) {
                // 检查是否可以闪避
                if (typeof canDodge === 'function' && canDodge(target)) {
                    // 闪避成功，不受到伤害
                    return;
                }
            }
            
            // 花仙子3级躲避技能：受到伤害时瞬移
            if (target && target.unit && target.unit.type === 'grass' && target.unit.level >= 3 && 
                unitTypes.grass.passiveSkills.dodge && damage > 0) {
                // 应用躲避效果
                const dodgeSuccess = unitTypes.grass.passiveSkills.dodge.effect(target, damage);
                // 如果成功躲避，更新目标单元格
                if (dodgeSuccess) {
                    targetCell = document.querySelector(`.grid-cell[data-index="${target.index}"]`);
                }
            }
            // 傀儡师2级替身技能：伤害由傀儡承担
            if (target && target.unit && target.unit.type === 'earthPup' && target.unit.level >= 2 && 
                unitTypes.earthPup.passiveSkills.substitute && damage > 0) {
                // 应用替身效果
                damage = unitTypes.earthPup.passiveSkills.substitute.effect(target, damage);
                // 如果伤害被完全转移，则不继续处理
                if (damage <= 0) return;
            }
            
            // 雷神3级激怒技能：受到伤害时增加攻击力
            if (target && target.unit && target.unit.type === 'electricThor' && target.unit.level >= 3 && 
                unitTypes.electricThor.passiveSkills.rage && damage > 0) {
                unitTypes.electricThor.passiveSkills.rage.increaseAttack(target.unit);
                // 更新显示
                updateUnitDisplay(target.index);
            }
            
            // 土属性共鸣减伤效果
            if (target && target.unit && target.unit.earthResonanceBuff && damage > 0) {
                // 减少20%伤害
                console.log('应用前的伤害:', damage);
                damage = damage * 0.8;
                console.log('应用后的伤害:', damage);
                
                // 显示减伤效果
                const damageReductionIndicator = document.createElement('div');
                damageReductionIndicator.className = 'damage-number';
                damageReductionIndicator.style.color = '#8B4513'; // 棕色
                damageReductionIndicator.textContent = '减伤20%';
                targetCell.appendChild(damageReductionIndicator);
                
                setTimeout(() => {
                    if (targetCell.contains(damageReductionIndicator)) {
                        targetCell.removeChild(damageReductionIndicator);
                    }
                }, 1000);
            }
            
            // 所有机关单位的伤害减免效果
            if (target && target.unit && target.unit.isTrap && damage > 0) {
                const originalDamage = damage;
                
                // 对于稻草人，使用其特有的伤害减免效果
                if (target.unit.type === 'scarecrow' && 
                    target.unit.passiveSkills && target.unit.passiveSkills.damageReduction) {
                    damage = target.unit.passiveSkills.damageReduction.effect(damage);
                } else {
                    // 对于其他所有机关单位，固定伤害为1
                    damage = 1;
                }
                
                // 显示减伤效果
                const reductionText = createDamageNumber(`减伤${Math.round(originalDamage - damage)}`, '#FFA500');
                targetCell.appendChild(reductionText);
                
                setTimeout(() => {
                    if (targetCell.contains(reductionText)) {
                        targetCell.removeChild(reductionText);
                    }
                }, 1000);
            }
            
            const damageNumber = document.createElement('div');
            damageNumber.className = 'damage-number';
            damageNumber.textContent = `-${Math.round(damage)}`;
            targetCell.appendChild(damageNumber);
            
            setTimeout(() => {
                if (targetCell.contains(damageNumber)) {
                    targetCell.removeChild(damageNumber);
                }
            }, 1000);
            
            // 拳击手反击
            if (attacker && target.unit.type === 'fire' && target.unit.level >= 2 && 
                target.unit.currentHP > 0 && !target.unit.passiveSkills?.counterAttack?.isCountering) {
                const counterAttackSkill = unitTypes.fire.passiveSkills.counterAttack;
                
                // 防止无限循环
                target.unit.passiveSkills = target.unit.passiveSkills || {};
                target.unit.passiveSkills.counterAttack = target.unit.passiveSkills.counterAttack || {};
                target.unit.passiveSkills.counterAttack.isCountering = true;
                
                // 反击伤害
                const counterDamage = counterAttackSkill.effect(target.unit, attacker.unit);
                
                // 攻击者的单元格
                const attackerCell = document.querySelector(`.grid-cell[data-index="${attacker.index}"]`);
                
                if (attackerCell) {
                    const counterIndicator = document.createElement('div');
                    counterIndicator.className = 'damage-number';
                    counterIndicator.style.color = '#FFD700'; // 金色
                    counterIndicator.textContent = '反击!';
                    targetCell.appendChild(counterIndicator);
                    
                    setTimeout(() => {
                        if (targetCell.contains(counterIndicator)) {
                            targetCell.removeChild(counterIndicator);
                        }
                    }, 1000);
                    
                    // 反击伤害
                    setTimeout(() => {
                        applyDamage(attacker, counterDamage, attackerCell);
                        target.unit.passiveSkills.counterAttack.isCountering = false;
                    }, 300);
                }
            }
            
            // 是否有水魔法师与目标相连
            let actualDamage = damage;
            
            // 查找所有水魔法师
            for (let i = 0; i < battleUnits.length; i++) {
                const unitData = battleUnits[i];
                if (unitData.unit && unitData.unit.type === 'waterMage' && 
                    unitData.isEnemy === target.isEnemy && unitData.unit.currentHP > 0) {
                    const waterMageSkill = unitTypes['waterMage'].skill;
                    
                    // 检查当前水魔法师是否与目标相连
                    if (waterMageSkill.linkedAllies[unitData.index] && 
                        waterMageSkill.linkedAllies[unitData.index].linkedAllyIndex === target.index) {
                        const waterMageUnit = unitData.unit;
                        const waterMageData = unitData;
                        
                        // 检查目标是否有护盾
                        let hasShield = false;
                        // 检查防卫者护盾
                        if (target.unit.type === 'earthGuardian' && 
                            unitTypes.earthGuardian.skill.shieldAmount[target.index] > 0) {
                            hasShield = true;
                        }
                        // 检查熔岩守护者护盾
                        else if (unitTypes.lavaGuardian.skill.shieldAmount[target.index] > 0) {
                            hasShield = true;
                        }
                        
                        // 目标没有护盾时，水魔法师才承担伤害
                        if (!hasShield) {
                            const sharedDamage = damage * 0.5;
                            actualDamage = damage - sharedDamage;
                            
                            // 水魔法师承担伤害
                            const waterMageCell = document.querySelector(`.grid-cell[data-index="${unitData.index}"]`);
                            if (waterMageCell) {
                                const sharedDamageNumber = document.createElement('div');
                                sharedDamageNumber.className = 'damage-number';
                                sharedDamageNumber.textContent = `-${Math.round(sharedDamage)}`;
                                waterMageCell.appendChild(sharedDamageNumber);
                                
                                setTimeout(() => {
                                    if (waterMageCell.contains(sharedDamageNumber)) {
                                        waterMageCell.removeChild(sharedDamageNumber);
                                    }
                                }, 1000);
                                
                                // 应用伤害给水魔法师
                                waterMageUnit.currentHP = Math.max(0, waterMageUnit.currentHP - sharedDamage);
                                
                                updateUnitDisplay(unitData.index);
                                
                                // 水魔法师是否死亡
                                if (waterMageUnit.currentHP <= 0) {
                                    handleUnitDeath(waterMageData);
                                }
                            }
                        }
                    }
                }
            }
            
            // 是否有护盾
            let finalDamage = actualDamage;
            let shieldDamaged = false; // 记录护盾是否受到伤害
            
            // 检查防卫者护盾
            if (target.unit.type === 'earthGuardian' && unitTypes.earthGuardian.skill.shieldAmount[target.index] > 0) {
                const shield = unitTypes.earthGuardian.skill.shieldAmount[target.index];
                
                // 护盾值大于等于伤害，则完全吸收伤害
                if (shield >= finalDamage) {
                    unitTypes.earthGuardian.skill.shieldAmount[target.index] -= finalDamage;
                    shieldDamaged = true; // 护盾受到伤害
                    finalDamage = 0;
                } else {
                    // 否则抵消部分伤害
                    finalDamage -= shield;
                    unitTypes.earthGuardian.skill.shieldAmount[target.index] = 0;
                    shieldDamaged = true; // 护盾受到伤害
                }
                
                unitTypes.earthGuardian.skill.updateShieldDisplay(target.index);
                
                // 清除护盾
                if (unitTypes.earthGuardian.skill.shieldAmount[target.index] <= 0) {
                    unitTypes.earthGuardian.skill.clearShield(target.index);
                }
                
                // 2级被动技能：反伤
                if (target.unit.level >= 2 && attacker && shieldDamaged) {
                    const reflectSkill = unitTypes.earthGuardian.passiveSkills.damageReflection;
                    const reflectDamage = reflectSkill.effect(target.unit, attacker.unit, actualDamage);
                    
                    // 显示反伤效果
                    const attackerCell = document.querySelector(`.grid-cell[data-index="${attacker.index}"]`);
                    if (attackerCell) {
                        const reflectIndicator = document.createElement('div');
                        reflectIndicator.className = 'damage-number';
                        reflectIndicator.style.color = '#8D6E63'; // 土色
                        reflectIndicator.textContent = `反伤 ${reflectDamage}`;
                        attackerCell.appendChild(reflectIndicator);
                        
                        setTimeout(() => {
                            if (attackerCell.contains(reflectIndicator)) {
                                attackerCell.removeChild(reflectIndicator);
                            }
                        }, 1000);
                        
                        // 应用反伤伤害
                        attacker.unit.currentHP = Math.max(0, attacker.unit.currentHP - reflectDamage);
                        updateUnitDisplay(attacker.index);
                        
                        // 检查攻击者是否死亡
                        if (attacker.unit.currentHP <= 0) {
                            handleUnitDeath(attacker);
                        }
                    }
                }
                
                // 3级被动技能：减速
                if (target.unit.level >= 3 && attacker && shieldDamaged) {
                    const slowdownSkill = unitTypes.earthGuardian.passiveSkills.slowdown;
                    slowdownSkill.applySlowdown(target.unit, attacker);
                }
            }
            // 检查熔岩守护者护盾
            else if (unitTypes.lavaGuardian.skill.shieldAmount && unitTypes.lavaGuardian.skill.shieldAmount[target.index] > 0) {
                const shield = unitTypes.lavaGuardian.skill.shieldAmount[target.index];
                
                // 护盾值大于等于伤害，则完全吸收伤害
                if (shield >= finalDamage) {
                    unitTypes.lavaGuardian.skill.shieldAmount[target.index] -= finalDamage;
                    shieldDamaged = true; // 护盾受到伤害
                    finalDamage = 0;
                } else {
                    // 否则抵消部分伤害
                    finalDamage -= shield;
                    unitTypes.lavaGuardian.skill.shieldAmount[target.index] = 0;
                    shieldDamaged = true; // 护盾受到伤害
                }
                
                unitTypes.lavaGuardian.skill.updateShieldDisplay(target.index);
                
                // 清除护盾
                if (unitTypes.lavaGuardian.skill.shieldAmount[target.index] <= 0) {
                    unitTypes.lavaGuardian.skill.clearShield(target.index);
                }
            }
            // 检查圣天使护盾
            else if (unitTypes.holyAngel.skill.shieldAmount && unitTypes.holyAngel.skill.shieldAmount[target.index] > 0) {
                const shield = unitTypes.holyAngel.skill.shieldAmount[target.index];
                
                // 护盾值大于等于伤害，则完全吸收伤害
                if (shield >= finalDamage) {
                    unitTypes.holyAngel.skill.shieldAmount[target.index] -= finalDamage;
                    shieldDamaged = true; // 护盾受到伤害
                    finalDamage = 0;
                } else {
                    // 否则抵消部分伤害
                    finalDamage -= shield;
                    unitTypes.holyAngel.skill.shieldAmount[target.index] = 0;
                    shieldDamaged = true; // 护盾受到伤害
                }
                
                unitTypes.holyAngel.skill.updateShieldDisplay(target.index);
                
                // 清除护盾
                if (unitTypes.holyAngel.skill.shieldAmount[target.index] <= 0) {
                    unitTypes.holyAngel.skill.clearShield(target.index);
                }
            }
            
            // 最终伤害给目标
            target.unit.currentHP = Math.max(0, target.unit.currentHP - finalDamage);
            
            // 检查单位是否死亡
            const isKilled = target.unit.currentHP <= 0;
            
            // 检查是否触发名刀效果（圣旗高级技能）
            if (isKilled && !target.isEnemy && !target.unit.namedBladeUsed && !target.unit.isTrap) {
                try {
                    // 检查是否在圣旗九宫格范围内且拥有名刀效果
                    if (unitTypes.holyFlag && unitTypes.holyFlag.passiveSkills && 
                        unitTypes.holyFlag.passiveSkills.namedBlade && 
                        unitTypes.holyFlag.passiveSkills.namedBlade.checkNamedBladeEffect(target.index)) {
                        
                        // 应用名刀效果，将单位血量设为1
                        unitTypes.holyFlag.passiveSkills.namedBlade.applyNamedBladeEffect(target.unit, target.index);
                        
                        // 更新isKilled状态
                        isKilled = false;
                    }
                } catch (error) {
                    console.error("名刀效果触发错误:", error);
                }
            }
            
            // 如果有攻击者且是连弩，且目标单位被击杀，触发狩猎之力技能
            if (isKilled && attacker && attacker.unit && attacker.unit.type === 'crossbow' && 
                gameState.traps.crossbow.advancedSkills.killBoost) {
                // 应用击杀加成
                unitTypes.crossbow.applyKillBoost(attacker.unit, attacker.index);
            }
            
            // 触发圣旗恢复效果
            if (target.unit.currentHP > 0 && !target.isEnemy) {
                // 查找场上所有圣旗
                for (let i = 0; i < battleUnits.length; i++) {
                    const flagData = battleUnits[i];
                    if (flagData.unit && flagData.unit.type === 'holyFlag' && 
                        !flagData.isEnemy && flagData.unit.currentHP > 0) {
                        
                        // 检查目标是否在圣旗九宫格范围内
                        if (flagData.unit.passiveSkills && 
                            flagData.unit.passiveSkills.healing && 
                            flagData.unit.passiveSkills.healing.isInRange(flagData.index, target.index) &&
                            flagData.index !== target.index) { // 排除圣旗自身
                            
                            // 触发恢复效果
                            flagData.unit.passiveSkills.healing.effect(flagData.unit, target.unit, finalDamage);
                            break; // 只触发一次恢复效果
                        }
                    }
                }
            }
            
            updateUnitDisplay(target.index);
            
            // 目标是否死亡
            if (target.unit.currentHP <= 0) {
                handleUnitDeath(target);
            }
        }

        // 攻击动画
        function animateAttack(attackerCell, targetCell, callback) {
            // 攻击者上下移动动画
            let attackerY = 0;
            let attackerDirection = 1;
            const attackerAnimation = setInterval(() => {
                attackerY += attackerDirection * 2;
                if (Math.abs(attackerY) >= 10) attackerDirection *= -1;
                attackerCell.style.transform = `translateY(${attackerY}px)`;
            }, 30);
            
            // 动画结束后恢复原位并执行回调
            setTimeout(() => {
                clearInterval(attackerAnimation);
                attackerCell.style.transform = '';
                if (callback) callback();
            }, 500);
        }

        // 处理单位死亡
        function handleUnitDeath(targetData) {
            const targetCell = document.querySelector(`.grid-cell[data-index="${targetData.index}"]`);
            
            // 检查是否有修女3级复活技能可以触发
            let resurrected = false;
            
            // 获取己方修女单位
            const isEnemy = targetData.isEnemy;
            const nunUnits = battleUnits.filter(u => 
                u.isEnemy === isEnemy && 
                u.unit.type === 'grassNun' && 
                u.unit.level >= 1 && 
                u.unit.currentHP > 0
            );
            
            // 如果有修女且单位是己方单位，尝试触发复活技能
            if (nunUnits.length > 0 && !unitTypes.grassNun.passiveSkills.resurrection.hasResurrected) {
                resurrected = unitTypes.grassNun.passiveSkills.resurrection.effect(targetData.unit, targetData);
            }
            
            // 如果单位被复活，则不继续处理死亡逻辑
            if (resurrected) {
                return;
            }
            
            // 检查死亡单位是否是稻草人，如果是且已解锁复活技能，设置复活倒计时
            if (targetData.unit && targetData.unit.type === 'scarecrow' && 
                gameState.traps.scarecrow.advancedSkills && 
                gameState.traps.scarecrow.advancedSkills.resurrection) {
                // 设置3回合的复活倒计时
                targetData.unit.resurrectionCountdown = 3;
                
                // 显示复活倒计时
                const countdownElement = document.createElement('div');
                countdownElement.className = 'resurrection-countdown';
                countdownElement.textContent = `复活: ${targetData.unit.resurrectionCountdown}`;
                targetCell.appendChild(countdownElement);
                
                console.log(`稻草人(${targetData.index})死亡，设置复活倒计时: ${targetData.unit.resurrectionCountdown}回合`);
            }
            
            // 检查死亡单位是否是火药桶，如果是，触发爆炸效果
            if (targetData.unit && targetData.unit.type === 'barrel' && 
                targetData.unit.passiveSkills && targetData.unit.passiveSkills.explosion) {
                targetData.unit.passiveSkills.explosion.effect(targetData.unit, targetData.index);
            }
            
            // 检查死亡单位是否是连弩，如果是，触发攻击力转移效果
            if (targetData.unit && targetData.unit.type === 'crossbow' && 
                gameState.traps.crossbow.advancedSkills && 
                gameState.traps.crossbow.advancedSkills.attackTransfer) {
                // 触发攻击力转移效果
                unitTypes.crossbow.transferAttack(targetData.unit, targetData.index);
            }
            
            // 检查死亡单位是否是存钱罐，如果是，触发计数减半效果
            if (targetData.unit && targetData.unit.type === 'piggyBank' && 
                targetData.unit.passiveSkills && targetData.unit.passiveSkills.countKills) {
                targetData.unit.passiveSkills.countKills.onDeath(targetData.unit);
                // 更新显示
                updatePiggyBankDisplay(targetData.unit);
            }
            
            // 检查死亡单位是否有中毒状态，如果有且场上有3级或以上的生化员，则触发传染效果
            if (targetData.unit && targetData.unit.statusEffects && targetData.unit.statusEffects.poisoned) {
                // 检查是否有3级或以上的生化员在场
                const hasBiochemistLv3 = battleUnits.some(data => 
                    data.unit && 
                    data.unit.type === 'grassBiochemist' && 
                    data.unit.level >= 3 && 
                    data.unit.currentHP > 0 && 
                    data.isEnemy !== targetData.isEnemy
                );
                
                if (hasBiochemistLv3) {
                    // 触发传染效果
                    unitTypes.grassBiochemist.passiveSkills.infection.effect(targetData.unit, targetData.index);
                }
            }
            
            // 是否有水魔法师与该单位相连
            for (let i = 0; i < battleUnits.length; i++) {
                const unitData = battleUnits[i];
                if (unitData.unit && unitData.unit.type === 'waterMage' && 
                    unitData.isEnemy === targetData.isEnemy && unitData.unit.currentHP > 0) {
                    const waterMageSkill = unitTypes['waterMage'].skill;
                    
                    // 该水魔法师是否与死亡单位相连
                    if (waterMageSkill.linkedAllies[unitData.index] && 
                        waterMageSkill.linkedAllies[unitData.index].linkedAllyIndex === targetData.index) {
                        // 寻找新链接目标
                        waterMageSkill.handleAllyDeath(unitData.index);
                    }
                }
            }
            
            // 检查是否有暗夜女王的蝙蝠附着在死亡单位上
            for (let i = 0; i < battleUnits.length; i++) {
                const unitData = battleUnits[i];
                if (unitData.unit && unitData.unit.type === 'darkQueen' && 
                    unitData.unit.currentHP > 0 && 
                    unitData.isEnemy !== targetData.isEnemy) {
                    // 检查死亡单位是否有暗夜女王的蝙蝠
                    if (unitData.unit.attachedBats && unitData.unit.attachedBats[targetData.index]) {
                        console.log(`单位 ${targetData.index} 死亡，转移暗夜女王的蝙蝠`);
                        
                        // 处理蝙蝠转移
                        if (unitTypes.darkQueen.passiveSkills && 
                            unitTypes.darkQueen.passiveSkills.batRelease && 
                            unitTypes.darkQueen.passiveSkills.batRelease.handleUnitDeath) {
                            unitTypes.darkQueen.passiveSkills.batRelease.handleUnitDeath(targetData.unit, targetData.index, unitData.unit);
                        }
                    }
                }
            }
            
            // 死亡单位是否是傀儡师，如果是则移除傀儡
            if (targetData.unit && targetData.unit.type === 'earthPup' && unitTypes.earthPup && unitTypes.earthPup.skill) {
                unitTypes.earthPup.skill.removePuppet(targetData.index);
            }
            
            // 死亡单位是否是傀儡，如果是立即移除
            if (targetData.unit && targetData.unit.isPuppet && unitTypes.earthPup && unitTypes.earthPup.skill) {
                const puppetMasterIndex = unitTypes.earthPup.skill.puppetMasters[targetData.index];
                if (puppetMasterIndex !== undefined) {
                    // 查找傀儡师
                    const puppetMasterData = battleUnits.find(unit => unit.index === parseInt(puppetMasterIndex));
                    
                    // 如果傀儡师存在且等级达到3级，触发陷阱技能
                    if (puppetMasterData && puppetMasterData.unit.level >= 3 && 
                        unitTypes.earthPup.passiveSkills.trap) {
                        // 触发陷阱技能
                        unitTypes.earthPup.passiveSkills.trap.effect(puppetMasterData, targetData.index);
                    }
                    
                    // 移除傀儡
                    gameState.units.battleField[targetData.index] = null;
                    targetCell.innerHTML = '';
                    targetCell.style.backgroundColor = targetData.index < 24 ? 'rgba(255, 82, 82, 0.1)' : 'rgba(79, 195, 247, 0.1)';
                    
                    // 从战斗单位列表中移除
                    const index = battleUnits.findIndex(unit => unit.index === targetData.index);
                    if (index !== -1) {
                        battleUnits.splice(index, 1);
                    }
                    
                    // 清除记录
                    delete unitTypes.earthPup.skill.puppets[puppetMasterIndex];
                    delete unitTypes.earthPup.skill.puppetMasters[targetData.index];
                    
                    console.log(`傀儡(${targetData.index})死亡，已从战场移除`);
                }
            }
            
            if (targetData.isEnemy) {
                // 敌方单位死亡，从战场和战斗单位列表中移除
                gameState.units.battleField[targetData.index] = null;
                targetCell.innerHTML = '';
                targetCell.style.backgroundColor = targetData.index < 24 ? 'rgba(255, 82, 82, 0.1)' : 'rgba(79, 195, 247, 0.1)';
                
                // 移除死亡单位
                const index = battleUnits.findIndex(unit => unit.index === targetData.index);
                if (index !== -1) {
                    battleUnits.splice(index, 1);
                }
                
                // 击杀奖励
                const shellReward = targetData.unit.level === 1 ? 5 : targetData.unit.level === 2 ? 10 : 15;
                gameState.player.shells += shellReward;
                shellDisplay.textContent = `贝壳: ${gameState.player.shells}`;
                
                // 存钱罐计数
                // 查找场上所有存钱罐，增加击杀计数
                for (let i = 0; i < battleUnits.length; i++) {
                    const unitData = battleUnits[i];
                    if (unitData.unit && unitData.unit.type === 'piggyBank' && 
                        !unitData.isEnemy && unitData.unit.currentHP > 0) {
                        // 触发存钱罐计数效果
                        if (unitData.unit.passiveSkills && unitData.unit.passiveSkills.countKills) {
                            unitData.unit.passiveSkills.countKills.effect(unitData.unit, targetData.unit, true);
                        }
                    }
                }
            } else {
                // 我方单位死亡，暂时隐藏但不移除
                targetCell.style.opacity = '0.3';
            }
        }
        
        // 检查战斗是否结束
        function checkBattleEnd() {
            // 检查敌方单位是否全部阵亡
            let enemyAlive = false;
            for (let i = 0; i < battleUnits.length; i++) {
                if (battleUnits[i].isEnemy && battleUnits[i].unit.currentHP > 0) {
                    enemyAlive = true;
                    break;
                }
            }
            
            if (!enemyAlive) {
                // 战斗结束，清理所有傀儡
                if (unitTypes.earthPup && unitTypes.earthPup.skill) {
                    unitTypes.earthPup.skill.cleanupAllPuppets();
                }
                return true;
            }
            
            // 检查我方单位是否全部阵亡
            let playerAlive = false;
            for (let i = 0; i < battleUnits.length; i++) {
                if (!battleUnits[i].isEnemy && battleUnits[i].unit.currentHP > 0) {
                    playerAlive = true;
                    break;
                }
            }
            
            if (!playerAlive) {
                // 战斗结束，清理所有傀儡
                if (unitTypes.earthPup && unitTypes.earthPup.skill) {
                    unitTypes.earthPup.skill.cleanupAllPuppets();
                }
            }
            
            return !playerAlive;
        }
        
        // 战斗回合结束时的处理
        function endBattleRound() {
            
            // 重置火焰法师的攻击力
            for (let i = 0; i < battleUnits.length; i++) {
                const unitData = battleUnits[i];
                if (unitData.unit && unitData.unit.type === 'fireMage' && unitData.unit.level >= 2 && unitData.unit.currentHP > 0) {
                    // 如果有记录原始攻击力，则重置
                    if (unitData.unit.originalAttack) {
                        console.log('重置火焰法师攻击力');
                        unitData.unit.attack = unitData.unit.originalAttack;
                        unitData.unit.originalAttack = 0;
                        updateUnitDisplay(unitData.index);
                    }
                }
                
                // 重置消防员的攻击力
                if (unitData.unit && unitData.unit.type === 'water' && unitData.unit.level >= 3 && unitData.unit.currentHP > 0) {
                    // 重置消防员的攻击力
                    if (unitTypes.water.passiveSkills && unitTypes.water.passiveSkills.solitude) {
                        console.log('重置消防员攻击力');
                        unitTypes.water.passiveSkills.solitude.resetAttack(unitData.unit);
                        updateUnitDisplay(unitData.index);
                    }
                }
            }
            
            // 清理花仙子激励效果
            if (unitTypes.grass.passiveSkills && unitTypes.grass.passiveSkills.inspire) {
                // 遍历所有被激励的单位，重置速度
                const inspiredUnits = unitTypes.grass.passiveSkills.inspire.inspiredUnits;
                for (const unitIndex in inspiredUnits) {
                    const unitData = battleUnits.find(u => u.index === parseInt(unitIndex));
                    if (unitData) {
                        unitTypes.grass.passiveSkills.inspire.resetSpeed(unitData);
                    }
                }
                // 清空激励单位记录
                unitTypes.grass.passiveSkills.inspire.cleanupInspire();
                console.log('清理花仙子激励效果');
            }
        }
        
        // 更新单位显示
        function updateUnitDisplay(index) {
            const unit = gameState.units.battleField[index];
            const cell = document.querySelector(`.grid-cell[data-index="${index}"]`);
            
            if (!cell || !unit) return;
            
            const baseStats = unitTypes[unit.type];
            
            // 更新血量显示
            const hpElement = cell.querySelector('.unit-hp');
            if (hpElement) {
                hpElement.innerHTML = `❤️${Math.round(unit.currentHP)}`;
            }
            
            // 更新攻击力显示
            const attackElement = cell.querySelector('.unit-attack');
            if (attackElement) {
                // 更新攻击力数值
                attackElement.innerHTML = `⚔️${unit.attack}`;
                
                // 根据单位类型和状态设置不同的颜色
                if (unit.type === 'fireMage' && unit.originalAttack && unit.attack > unit.originalAttack) {
                    // 火焰法师提纯技能显示金色
                    attackElement.style.color = '#FFD700';
                } else if (unit.type === 'fire' && unit.level >= 3) {
                    // 拳击手血怒效果高亮显示
                    const bloodRageSkill = unitTypes.fire.passiveSkills.bloodRage;
                    const bonusPercent = bloodRageSkill.effect(unit);
                    
                    // 血怒效果高亮
                    if (bonusPercent > 0) {
                        // 高亮效果
                        attackElement.style.color = '#FF5252';
                    }
                } else {
                    attackElement.style.color = '';
                }
            }
            
            // 更新中毒回合
            let poisonTurnsElement = cell.querySelector('.poison-turns');
            
            //剩余中毒回合数
            if (unit.statusEffects && unit.statusEffects.poisoned) {
                const poisonEffect = unit.statusEffects.poisoned;
                const remainingTurns = poisonEffect.duration - (battleTurn - poisonEffect.startTurn);
                
                if (!poisonTurnsElement) {
                    poisonTurnsElement = document.createElement('div');
                    poisonTurnsElement.className = 'poison-turns';
                    cell.appendChild(poisonTurnsElement);
                }
                
                poisonTurnsElement.textContent = `☠${remainingTurns}`;
            } else if (poisonTurnsElement) {
                // 移除中毒
                cell.removeChild(poisonTurnsElement);
            }
            
            // 更新无法行动状态
            let cantActTurnsElement = cell.querySelector('.cant-act-turns');
            
            // 剩余无法行动回合数
            if (unit.statusEffects && unit.statusEffects.cantAct) {
                const cantActEffect = unit.statusEffects.cantAct;
                const remainingTurns = cantActEffect.duration - (battleTurn - cantActEffect.startTurn);
                
                if (!cantActTurnsElement) {
                    cantActTurnsElement = document.createElement('div');
                    cantActTurnsElement.className = 'cant-act-turns';
                    cell.appendChild(cantActTurnsElement);
                }
                
                cantActTurnsElement.textContent = `⛔${remainingTurns}`;
            } else if (cantActTurnsElement) {
                // 移除无法行动状态
                cell.removeChild(cantActTurnsElement);
            }
            
            // 更新蓝量显示
            let manaElement = cell.querySelector('.unit-mana');
            let manaTextElement = cell.querySelector('.unit-mana-text');
            
            if (!manaElement) {
                manaElement = document.createElement('div');
                manaElement.className = 'unit-mana';
                cell.appendChild(manaElement);
            }
            
            if (!manaTextElement) {
                manaTextElement = document.createElement('div');
                manaTextElement.className = 'unit-mana-text';
                cell.appendChild(manaTextElement);
            }
            
            // 计算蓝量百分比（基于300的上限）
            const manaPercentage = (unit.mana / 300) * 100;
            manaElement.style.width = `${manaPercentage}%`;
            manaTextElement.textContent = `${unit.mana}/300`;
        }
        
        // 结束战斗
        function endBattle() {
            battleInProgress = false;
            // 重置战斗已开始标志
            isBattleStarted = false;
            
            // 重置连弩攻击计数
            if (unitTypes.crossbow && unitTypes.crossbow.resetAttackCount) {
                unitTypes.crossbow.resetAttackCount();
            }
            
            // 重置连弩击杀加成
            if (unitTypes.crossbow && unitTypes.crossbow.resetKillBoost) {
                unitTypes.crossbow.resetKillBoost();
            }
            
            // 重置连弩临终遗力效果
            if (unitTypes.crossbow && unitTypes.crossbow.resetAttackTransfer) {
                unitTypes.crossbow.resetAttackTransfer();
            }
            
            // 保存存钱罐的击杀计数
            for (let i = 0; i < gameState.units.battleField.length; i++) {
                const unit = gameState.units.battleField[i];
                if (unit && unit.type === 'piggyBank') {
                    // 保存击杀计数到gameState
                    gameState.traps.piggyBank.savedKillCount = unit.killCount || 0;
                    console.log(`保存存钱罐计数：${gameState.traps.piggyBank.savedKillCount}`);
                    break;
                }
            }
            
            // 重置拳击手的血怒效果
            for (let i = 0; i < gameState.units.battleField.length; i++) {
                const unit = gameState.units.battleField[i];
                if (unit && unit.type === 'fire' && unit.level >= 3) {
                    // 重置血怒效果
                    if (unitTypes.fire.passiveSkills && unitTypes.fire.passiveSkills.bloodRage) {
                        unitTypes.fire.passiveSkills.bloodRage.resetBloodRage(unit);
                        // 更新显示
                        updateUnitDisplay(i);
                    }
                }
            }
            
            // 记录各个机关的位置信息
            for (let i = 0; i < gameState.units.battleField.length; i++) {
                const unit = gameState.units.battleField[i];
                if (unit && unit.isTrap) {
                    // 根据机关类型记录位置
                    switch (unit.type) {
                        case 'scarecrow':
                            gameState.traps.scarecrow.lastPosition = i;
                            break;
                        case 'barrel':
                            gameState.traps.barrel.lastPosition = i;
                            break;
                        case 'crossbow':
                            gameState.traps.crossbow.lastPosition = i;
                            break;
                        case 'piggyBank':
                            gameState.traps.piggyBank.lastPosition = i;
                            break;
                        case 'holyFlag':
                            gameState.traps.holyFlag.lastPosition = i;
                            break;
                    }
                }
            }
            
            // 清空场上所有机关单位
            for (let i = 0; i < gameState.units.battleField.length; i++) {
                const unit = gameState.units.battleField[i];
                if (unit && unit.isTrap) {
                    // 清除机关单位
                    gameState.units.battleField[i] = null;
                    
                    // 清除对应的视觉显示
                    const trapCell = document.querySelector(`.grid-cell[data-index="${i}"]`);
                    if (trapCell) {
                        trapCell.innerHTML = '';
                        trapCell.style.backgroundColor = i < 24 ? 'rgba(255, 82, 82, 0.1)' : 'rgba(79, 195, 247, 0.1)';
                    }
                }
            }
            
            // 清除水属性共鸣效果
            for (let i = 0; i < gameState.units.battleField.length; i++) {
                const unit = gameState.units.battleField[i];
                if (unit && unit.waterResonanceDebuff) {
                    unit.attack = Math.round(unit.attack / 0.8); // 恢复被削弱的攻击力
                    delete unit.waterResonanceDebuff;
                    updateUnitDisplay(i);
                }
                
                // 清除草属性共鸣效果
                if (unit && unit.grassResonanceDebuff) {
                    delete unit.grassResonanceDebuff;
                }
            }
            
            // 更新战场显示（重新显示龙蛋按钮）
            setTimeout(() => updateBattlefieldDisplay(), 500);
            
            // 检查是否有敌人存活
            let enemyAlive = false;
            for (let i = 0; i < 24; i++) {
                if (gameState.units.battleField[i] !== null) {
                    enemyAlive = true;
                    break;
                }
            }
            
            // 检查盗贼的"苟活"技能
            let playerThieves = 0;
            let enemyThieves = 0;
            let hasLevel3Thief = false;
            
            // 统计战场上存活的盗贼数量
            for (let i = 0; i < gameState.units.battleField.length; i++) {
                const unit = gameState.units.battleField[i];
                if (unit && unit.type === 'earth' && unit.currentHP > 0) {
                    // 检查是否为敌方盗贼
                    const isEnemy = i < 24; // 前24格为敌方区域
                    
                    if (isEnemy) {
                        enemyThieves++;
                    } else {
                        playerThieves++;
                        if (unit.level >= 3) {
                            hasLevel3Thief = true;
                        }
                    }
                }
            }
            
            // 检查备战区的盗贼
            for (let i = 0; i < gameState.units.reserve.length; i++) {
                const unit = gameState.units.reserve[i];
                if (unit && unit.type === 'earth' && unit.level >= 3) {
                    hasLevel3Thief = true;
                }
            }
            
            // 如果有3级盗贼，触发"苟活"技能
            if (hasLevel3Thief && unitTypes.earth.passiveSkills && unitTypes.earth.passiveSkills.survival) {
                const netChange = unitTypes.earth.passiveSkills.survival.effect(playerThieves, enemyThieves);
                
                // 显示贝壳变化
                if (netChange !== 0) {
                    const message = netChange > 0 ? 
                        `盗贼的"苟活"技能触发，获得 ${netChange} 贝壳！` : 
                        `盗贼的"苟活"技能触发，失去 ${Math.abs(netChange)} 贝壳！`;
                    
                    alert(message);
                    
                    // 更新贝壳显示
                    if (shellDisplay) {
                        shellDisplay.textContent = `Shells: ${gameState.player.shells}`;
                    }
                }
            }
            
            // 重置盗贼的"购置"技能加成
            for (let i = 0; i < gameState.units.battleField.length; i++) {
                const unit = gameState.units.battleField[i];
                if (unit && unit.type === 'earth' && unit.purchaseBonus) {
                    if (unitTypes.earth.passiveSkills && unitTypes.earth.passiveSkills.purchase) {
                        unitTypes.earth.passiveSkills.purchase.reset(unit);
                    }
                }
            }
            
            // 战斗结束后重置所有单位蓝量为0
            // 重置战场上的单位
            for (let i = 0; i < gameState.units.battleField.length; i++) {
                if (gameState.units.battleField[i] !== null) {
                    gameState.units.battleField[i].mana = 0;
                    
                    // 清除中毒效果
                    if (gameState.units.battleField[i].statusEffects && gameState.units.battleField[i].statusEffects.poisoned) {
                        delete gameState.units.battleField[i].statusEffects.poisoned;
                        
                        const unitCell = document.querySelector(`.grid-cell[data-index="${i}"]`);
                        if (unitCell) {
                            const effectElement = unitCell.querySelector('.poison-effect');
                            if (effectElement) {
                                unitCell.removeChild(effectElement);
                            }
                            
                            const poisonTurnsElement = unitCell.querySelector('.poison-turns');
                            if (poisonTurnsElement) {
                                unitCell.removeChild(poisonTurnsElement);
                            }
                        }
                    }
                    
                    // 清除无法行动状态
                    if (gameState.units.battleField[i].statusEffects && gameState.units.battleField[i].statusEffects.cantAct) {
                        delete gameState.units.battleField[i].statusEffects.cantAct;
                        
                        const unitCell = document.querySelector(`.grid-cell[data-index="${i}"]`);
                        if (unitCell) {
                            const stunEffect = unitCell.querySelector('.stun-effect');
                            if (stunEffect) {
                                unitCell.removeChild(stunEffect);
                            }
                            
                            const cantActTurnsElement = unitCell.querySelector('.cant-act-turns');
                            if (cantActTurnsElement) {
                                unitCell.removeChild(cantActTurnsElement);
                            }
                        }
                    }
                }
            }
            // 重置备战区单位
            for (let i = 0; i < gameState.units.reserve.length; i++) {
                if (gameState.units.reserve[i] !== null) {
                    gameState.units.reserve[i].mana = 0;
                    
                    // 清除中毒
                    if (gameState.units.reserve[i].statusEffects && gameState.units.reserve[i].statusEffects.poisoned) {
                        delete gameState.units.reserve[i].statusEffects.poisoned;
                    }
                }
            }
            
            // 重置生长效果
            for (let i = 0; i < gameState.units.battleField.length; i++) {
                const unit = gameState.units.battleField[i];
                if (unit && unit.growthApplied) {
                    // 恢复原始属性值
                    if (unit.originalMaxHP) {
                        unit.maxHP = unit.originalMaxHP;
                        unit.currentHP = Math.min(unit.currentHP, unit.maxHP);
                        delete unit.originalMaxHP;
                    }
                    if (unit.originalAttack) {
                        unit.attack = unit.originalAttack;
                        delete unit.originalAttack;
                    }
                    delete unit.growthApplied;
                }
            }
            
            // 清理生命链锁效果
            const waterMageSkill = unitTypes['waterMage'].skill;
            waterMageSkill.cleanupLifeChain();
            
            // 清理护盾
            const earthGuardianSkill = unitTypes['earthGuardian'].skill;
            earthGuardianSkill.cleanupShields();
            
            // 清理熔岩守护者护盾
            if (unitTypes['lavaGuardian'] && unitTypes['lavaGuardian'].skill) {
                const lavaGuardianSkill = unitTypes['lavaGuardian'].skill;
                lavaGuardianSkill.cleanupShields();
            }
            
            // 清理圣天使护盾
            if (unitTypes['holyAngel'] && unitTypes['holyAngel'].skill) {
                const holyAngelSkill = unitTypes['holyAngel'].skill;
                holyAngelSkill.cleanupShields();
            }
            
            // 清理暗夜女王蝙蝠
            if (unitTypes['darkQueen']) {
                unitTypes['darkQueen'].cleanupBats();
            }
            
            // 应用辅助羁绊的治疗效果
            applySupportSynergyHealing();
            
            // 重置羁绊效果
            resetSynergies();
            
            // 重置逃跑按钮
            const escapeButton = document.getElementById('escape-button');
            escapeButton.disabled = false;
            escapeButton.style.backgroundColor = '#FF5252';
            
            // 更改按钮为回到地图，并重新启用单位回复按钮
            battleButton.textContent = '回到地图';
            battleButton.disabled = false;
            document.getElementById('heal-button').disabled = false;
            
            if (!enemyAlive) {                
                // 检查是否有氧气增幅效果
                if (gameState.effects && gameState.effects.oxygenBoostOnVictory) {
                    // 计算增加的氧气量（10%）
                    const oxygenBoost = Math.round(100 * 0.1); // 氧气瓶容量为100
                    
                    // 增加氧气
                    gameState.
                    player.oxygen = Math.min(100, gameState.player.oxygen + oxygenBoost);
                    
                    // 更新氧气显示
                    oxygenDisplay.textContent = `氧气: ${gameState.player.oxygen}`;
                    
                    // 显示效果
                    alert(`氧气增幅效果触发！获得${oxygenBoost}点氧气`);
                }
                
                // 解锁牢笼中的单位
                alert('牢笼已解锁，你可以拖拽牢笼中的单位到战场或备战区！');
                
                // 使牢笼单位可拖拽
                if (gameState.units.cage) {
                    // 重置牢笼单位的蓝量
                    gameState.units.cage.mana = 0;
                    cageContainer.draggable = true;
                    cageContainer.addEventListener('dragstart', (e) => {
                        const data = {
                            sourceType: 'cage',
                            sourceIndex: -1 // 特殊标记为牢笼
                        };
                        e.dataTransfer.setData('application/json', JSON.stringify(data));
                    });
                    
                    // 添加处理牢笼单位拖拽的事件
                    const handleCageDrop = (e, targetType, targetIndex) => {
                        const unitData = JSON.parse(e.dataTransfer.getData('application/json'));
                        if (unitData.sourceType === 'cage' && gameState.units.cage) {
                            // 检查目标位置是否有单位
                            let targetUnit = null;
                            let isUpgradeOperation = false;
                            
                            if (targetType === 'battlefield') {
                                targetUnit = gameState.units.battleField[targetIndex];
                                if (!targetUnit) {
                                    // 移动到空格子
                                    gameState.units.battleField[targetIndex] = gameState.units.cage;
                                } else if (targetUnit.type === gameState.units.cage.type) {
                                    isUpgradeOperation = true;
                                    console.log('检测到升级操作');
                                }
                            } else if (targetType === 'reserve') {
                                targetUnit = gameState.units.reserve[targetIndex];
                                if (!targetUnit) {
                                    // 移动到空格子
                                    gameState.units.reserve[targetIndex] = gameState.units.cage;
                                } else if (targetUnit.type === gameState.units.cage.type) {
                                    // 拖到同属性单位上，视为升级操作
                                    isUpgradeOperation = true;
                                    console.log('检测到升级操作');
                                }
                            }
                            
                            // 无论如何都清空牢笼（即使是拖到了有单位的格子上）
                            gameState.units.cage = null;
                            cageContainer.innerHTML = '';
                            cageContainer.style.backgroundColor = '#666';
                            cageContainer.draggable = false;
                            
                            // 更新显示
                            updateBattlefieldDisplay();
                            initBattleReserveArea();
                        }
                    };
 
                    // 更新战场单元格的drop事件
                    for (let i = 24; i < 48; i++) {
                        const cell = document.querySelector(`.grid-cell[data-index="${i}"]`);
                        // 允许拖拽到所有格子
                        if (cell) {
                            cell.addEventListener('drop', (e) => {
                                e.preventDefault();
                                handleCageDrop(e, 'battlefield', i);
                            });
                        }
                    }
                    
                    // 更新备战区的drop事件
                    const reserveSlots = document.querySelectorAll('#battle-reserve-area .reserve-slot');
                    reserveSlots.forEach((slot, index) => {
                        // 允许拖拽到所有格子
                        if (true) {
                            slot.addEventListener('drop', (e) => {
                                e.preventDefault();
                                handleCageDrop(e, 'reserve', index);
                            });
                        }
                    });
                }
            } else {
                // 玩家失败
                alert('战斗结束！');
                
                // 自动保存游戏
                if (typeof saveSystem !== 'undefined') {
                    saveSystem.saveGame();
                }
            }
            
            battleButton.onclick = () => {
                // 检查是否有血量为0的单位在战场上
                let deadUnitsOnField = false;
                for (let i = 24; i < 48; i++) {
                    const unit = gameState.units.battleField[i];
                    if (unit && unit.currentHP <= 0) {
                        deadUnitsOnField = true;
                        break;
                    }
                }
                
                if (deadUnitsOnField) {
                    alert('请将阵亡的单位移动到备战区！');
                    return;
                }
                
                // 备份单位信息
                backupUnitInfo();
                showScreen('dungeon-map');
            };
        }
        
        // 备份单位信息
        function backupUnitInfo() {
            playerUnitBackup = [];
            
            // 备份战场单位
            for (let i = 24; i < 48; i++) {
                const unit = gameState.units.battleField[i];
                if (unit) {
                    playerUnitBackup.push({
                        unit: JSON.parse(JSON.stringify(unit)),
                        index: i
                    });
                }
            }
            
            // 备份备战区单位
            for (let i = 0; i < gameState.units.reserve.length; i++) {
                const unit = gameState.units.reserve[i];
                if (unit) {
                    playerUnitBackup.push({
                        unit: JSON.parse(JSON.stringify(unit)),
                        index: -i - 1 // 负数表示备战区，从-1开始
                    });
                }
            }
        }
        
        // 合并单位辅助函数
        function mergeUnits(targetUnit, sourceUnit) {
            // 保存原始类型
            const unitType = targetUnit.type;
            
            // 升级等级
            targetUnit.level = Math.min(targetUnit.level + sourceUnit.level, 3);
            
            // 选择较大的生命值并翻倍
            const maxHP = Math.max(targetUnit.maxHP, sourceUnit.maxHP);
            targetUnit.maxHP = maxHP * 2 ;
            targetUnit.currentHP = targetUnit.maxHP; // 升级时恢复满血
            
            // 选择较大的攻击力并翻倍
            const attack = Math.max(targetUnit.attack, sourceUnit.attack);
            targetUnit.attack = attack * 2;
            
            // 蓝量回复和速度取较大者
            targetUnit.manaRegen = Math.max(targetUnit.manaRegen, sourceUnit.manaRegen);
            targetUnit.speed = Math.max(targetUnit.speed, sourceUnit.speed);
            
            // 初始化单位可能需要的特殊属性或技能
            const baseStats = unitTypes[unitType];
            
            // 初始化反击技能
            if (unitType === 'fire' && baseStats.passiveSkills) {
                if (targetUnit.level >= baseStats.passiveSkills.counterAttack.unlockLevel) {
                    targetUnit.passiveSkills = targetUnit.passiveSkills || {};
                    targetUnit.passiveSkills.counterAttack = {
                        isCountering: false
                    };
                }
                
                // 初始化血怒技能
                if (targetUnit.level >= baseStats.passiveSkills.bloodRage.unlockLevel) {
                    targetUnit.passiveSkills = targetUnit.passiveSkills || {};
                    targetUnit.passiveSkills.bloodRage = {};
                }
            }
            
            console.log(`合并单位: ${unitType}, 新等级: ${targetUnit.level}, 血量: ${targetUnit.maxHP}, 攻击: ${targetUnit.attack}, 速度: ${targetUnit.speed}, 回蓝: ${targetUnit.manaRegen}`);
            
            // 在单位属性变更后更新单位类型的基础属性
            if (unitTypes[unitType]) {
                // 只有当单位等级为1时才更新基础属性
                if (targetUnit.level === 1) {
                    unitTypes[unitType].hp = targetUnit.maxHP;
                    unitTypes[unitType].attack = targetUnit.attack;
                    unitTypes[unitType].speed = targetUnit.speed;
                    unitTypes[unitType].manaRegen = targetUnit.manaRegen;
                }
                
                // 自动保存游戏
                if (typeof saveSystem !== 'undefined') {
                    saveSystem.saveGame();
                }
            }
            
            return targetUnit;
        }
        
        // 恢复单位信息
        function restoreUnitInfo() {
            // 清空备战区
            gameState.units.reserve = [null, null, null, null, null, null];
            
            // 恢复备份的单位
            playerUnitBackup.forEach(backup => {
                if (backup.index >= 24) {
                    // 战场单位
                    gameState.units.battleField[backup.index] = backup.unit;
                } else {
                    // 备战区单位，索引为负数
                    const reserveIndex = -backup.index - 1;
                    gameState.units.reserve[reserveIndex] = backup.unit;
                }
            });
        }

        // Initialize the game
        showScreen('home');

        // 初始化资源显示元素
        window.levelDisplay = document.getElementById('level-display');
        window.expDisplay = document.getElementById('exp-bar');
        window.goldDisplay = document.getElementById('gold-display');
        window.summonStonesDisplay = document.getElementById('summon-stones-display');
        window.ticketsDisplay = document.getElementById('tickets-display');
        
        // 更新资源显示
        function updateResourceDisplay() {
            levelDisplay.textContent = `Lv.${gameState.player.level}`;
            // 更新经验条
            const expPercentage = gameState.player.exp / (gameState.player.level * 100) * 100;
            document.getElementById('exp-fill').style.width = `${Math.min(100, expPercentage)}%`;
            goldDisplay.textContent = gameState.player.gold;
            summonStonesDisplay.textContent = gameState.player.summonStones;
            ticketsDisplay.textContent = gameState.player.tickets;
        }
        
        // 初始显示
        updateResourceDisplay();

        // 检查是否有保存的游戏数据
        if (saveSystem.hasSavedGame()) {
            const saveInfo = saveSystem.getSaveInfo();
            if (confirm(`发现存档：等级 ${saveInfo.playerLevel}，保存于 ${saveInfo.saveDate}。是否加载？`)) {
                saveSystem.loadGame();
            }
        }

        // 添加保存和加载游戏按钮的事件监听器
        document.getElementById('save-button').addEventListener('click', function() {
            if (saveSystem.saveGame()) {
                alert('游戏已保存！');
            } else {
                alert('保存游戏失败！');
            }
        });

        document.getElementById('load-button').addEventListener('click', function() {
            if (saveSystem.hasSavedGame()) {
                const saveInfo = saveSystem.getSaveInfo();
                if (confirm(`确定要加载存档：等级 ${saveInfo.playerLevel}，保存于 ${saveInfo.saveDate}？当前进度将丢失！`)) {
                    if (saveSystem.loadGame()) {
                        alert('游戏已加载！');
                        // 重新加载页面以应用所有更改
                        location.reload();
                    } else {
                        alert('加载游戏失败！');
                    }
                }
            } else {
                alert('没有找到保存的游戏数据！');
            }
        });
        
        // 添加清空存档按钮的事件监听器
        document.getElementById('reset-save-button').addEventListener('click', function() {
            if (saveSystem.hasSavedGame()) {
                if (confirm('确定要清空游戏存档并重置游戏吗？此操作不可恢复！')) {
                    // 清空存档
                    if (saveSystem.deleteSave()) {
                        alert('游戏存档已清空！游戏将重新加载。');
                        // 重新加载页面以重置游戏
                        location.reload();
                    } else {
                        alert('清空存档失败！');
                    }
                }
            } else {
                alert('没有找到保存的游戏数据！');
            }
        });
    </script>
    
    <script src="js/shopSystem.js"></script>
</body>
